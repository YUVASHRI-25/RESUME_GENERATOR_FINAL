<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anaisha Timeline</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Lato:wght@300;400;700&family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Merriweather:wght@300;400;700&family=Montserrat:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="resume">

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <h1 id="name">ANAISHA PARVATI</h1>
      <h2 id="title">Office Marketing</h2>

      <div class="contact-row">
        <span id="phone">+123-456-7890</span>
        <span id="location">123 Anywhere St., Any City</span>
        <span id="email">hello@reallygreatsite.com</span>
        <span id="website">www.reallygreatsite.com</span>
        <span id="linkedin">linkedin.com/in/username</span>
        <span id="github">github.com/username</span>
      </div>
    </div>

    <div class="header-right">
      <img id="profileImage" src="/avatar.png" alt="Profile" />
    </div>
  </header>

  <hr />

  <!-- ABOUT -->
  <section id="about-section">
    <h3 id="aboutHeading" contenteditable="true" data-field="aboutHeading">ABOUT ME</h3>
    <p id="aboutText"></p>
  </section>

  <hr />

  <!-- TWO COLUMN TIMELINE -->
  <section class="timeline">

    <!-- LEFT COLUMN -->
    <div class="left">

      <div class="block" id="education-block">
        <h3 id="educationHeading" contenteditable="true" data-field="educationHeading">EDUCATION</h3>
        <div id="educationContainer"></div>
      </div>

      <div class="block" id="skills-block">
        <h3 id="skillsHeading" contenteditable="true" data-field="skillsHeading">SKILLS</h3>
        <ul id="skillsContainer"></ul>
      </div>

      <div class="block" id="projects-block">
        <h3 id="projectsHeading" contenteditable="true" data-field="projectsHeading">PROJECTS</h3>
        <div id="projectsContainer"></div>
      </div>

      <div class="block" id="languages-block">
        <h3 id="languagesHeading" contenteditable="true" data-field="languagesHeading">LANGUAGES</h3>
        <ul id="languagesContainer"></ul>
      </div>

      <div class="block" id="awards-block">
        <h3 id="awardsHeading" contenteditable="true" data-field="awardsHeading">AWARDS</h3>
        <ul id="awardsContainer"></ul>
      </div>

    </div>

    <!-- VERTICAL LINE -->
    <div class="line"></div>

    <!-- RIGHT COLUMN -->
    <div class="right">

      <div class="block" id="experience-block">
        <h3 id="experienceHeading" contenteditable="true" data-field="experienceHeading">WORK EXPERIENCE</h3>
        <div id="experienceContainer"></div>
      </div>

      <div class="block" id="references-block">
        <h3 id="referencesHeading" contenteditable="true" data-field="referencesHeading">REFERENCES</h3>
        <div id="referencesContainer"></div>
      </div>

    </div>

  </section>

  <hr />

  <!-- DYNAMIC CUSTOM SECTIONS -->
  <div id="customSectionsContainer"></div>

</div>

<script>
  function updateContent(data) {
    if (!data || !data.payload) return;
    
    const payload = data.payload;
    const settings = payload.sectionSettings || {};

    // Apply font
    const font = payload.fontFamily || 'Inter';
    const fontValue = `'${font}', sans-serif`;
    document.documentElement.style.setProperty('--resume-font', fontValue);
    document.body.style.fontFamily = fontValue;

    // Apply theme colors
    if (payload.theme) {
      window.currentTheme = payload.theme; // Store for PDF generation
      const theme = payload.theme;
      if (theme.primaryColor) {
        document.documentElement.style.setProperty('--primary-color', theme.primaryColor);
      }
      if (theme.backgroundColor) {
        document.documentElement.style.setProperty('--background-color', theme.backgroundColor);
      }
      if (theme.textColor) {
        document.documentElement.style.setProperty('--text-color', theme.textColor);
      }
      if (theme.textSecondary) {
        document.documentElement.style.setProperty('--text-secondary', theme.textSecondary);
      }
      if (theme.borderColor) {
        document.documentElement.style.setProperty('--border-color', theme.borderColor);
      }
      if (theme.lineColor) {
        document.documentElement.style.setProperty('--line-color', theme.lineColor);
      }
    }

    // Personal info
    if (payload.personalInfo) {
      const { fullName, title, email, phone, location, leetcode, linkedin, github } = payload.personalInfo;
      if (fullName) document.getElementById('name').textContent = fullName;
      if (title) document.getElementById('title').textContent = title;
      if (phone) document.getElementById('phone').textContent = phone;
      if (location) document.getElementById('location').textContent = location;
      if (email) document.getElementById('email').textContent = email;
      if (leetcode) document.getElementById('website').textContent = leetcode;
      if (linkedin) document.getElementById('linkedin').textContent = linkedin;
      if (github) document.getElementById('github').textContent = github;
    }

    // Profile image
    if (payload.profileImage) {
      document.getElementById('profileImage').src = payload.profileImage;
    }

    // About section with sectionSettings
    const aboutHeading = document.getElementById('aboutHeading');
    const aboutSection = document.getElementById('about-section');
    // Only apply default heading if user hasn't customized it
    if (aboutHeading && settings.about?.heading && !aboutHeading.hasAttribute('data-customized')) {
      aboutHeading.textContent = settings.about.heading;
    }
    if (aboutSection) {
      aboutSection.style.display = settings.about?.visible !== false ? 'block' : 'none';
    }
    if (payload.about) {
      document.getElementById('aboutText').innerHTML = (payload.about.content || '').replace(/\n/g, '<br>');
    }

    // Education with sectionSettings
    const educationHeading = document.getElementById('educationHeading');
    const educationBlock = document.getElementById('education-block');
    // Only apply default heading if user hasn't customized it
    if (educationHeading && settings.education?.heading && !educationHeading.hasAttribute('data-customized')) {
      educationHeading.textContent = settings.education.heading;
    }
    if (educationBlock) {
      educationBlock.style.display = settings.education?.visible !== false ? 'block' : 'none';
    }
    
    if (payload.education && Array.isArray(payload.education)) {
      const educationContainer = document.getElementById('educationContainer');
      educationContainer.innerHTML = '';
      payload.education.forEach(edu => {
        const item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = `
          <strong>${edu.school || ''}</strong>
          <p>${edu.degree || ''}</p>
          <span>${edu.startDate || ''}${edu.endDate ? ' - ' + edu.endDate : ''}</span>
          ${edu.description ? `<p>${edu.description.replace(/\n/g, '<br>')}</p>` : ''}
        `;
        educationContainer.appendChild(item);
      });
    }

    // Skills with sectionSettings
    const skillsHeading = document.getElementById('skillsHeading');
    const skillsBlock = document.getElementById('skills-block');
    // Only apply default heading if user hasn't customized it
    if (skillsHeading && settings.skills?.heading && !skillsHeading.hasAttribute('data-customized')) {
      skillsHeading.textContent = settings.skills.heading;
    }
    if (skillsBlock) {
      skillsBlock.style.display = settings.skills?.visible !== false ? 'block' : 'none';
    }
    
    if (payload.skills && Array.isArray(payload.skills)) {
      const skillsContainer = document.getElementById('skillsContainer');
      skillsContainer.innerHTML = '';
      payload.skills.forEach(skill => {
        const li = document.createElement('li');
        li.textContent = typeof skill === 'string' ? skill : (skill.name || '');
        skillsContainer.appendChild(li);
      });
    }

    // Projects with sectionSettings
    const projectsHeading = document.getElementById('projectsHeading');
    const projectsBlock = document.getElementById('projects-block');
    // Only apply default heading if user hasn't customized it
    if (projectsHeading && settings.projects?.heading && !projectsHeading.hasAttribute('data-customized')) {
      projectsHeading.textContent = settings.projects.heading;
    }
    if (projectsBlock) {
      projectsBlock.style.display = settings.projects?.visible !== false ? 'block' : 'none';
    }
    
    if (payload.projects && Array.isArray(payload.projects)) {
      const projectsContainer = document.getElementById('projectsContainer');
      projectsContainer.innerHTML = '';
      payload.projects.forEach(proj => {
        const item = document.createElement('div');
        item.className = 'item';
        const duration = proj.date || proj.year || '';
        let bulletHTML = '';
        if (proj.bullets && Array.isArray(proj.bullets)) {
          bulletHTML = '<ul>' + proj.bullets.map(b => `<li>${b}</li>`).join('') + '</ul>';
        }
        item.innerHTML = `
          <div class="row">
            <strong>${proj.title || proj.name || ''}</strong>
            <span>${duration}</span>
          </div>
          ${proj.description ? `<p>${proj.description.replace(/\n/g, '<br>')}</p>` : ''}
          ${bulletHTML}
        `;
        projectsContainer.appendChild(item);
      });
    }

    // Languages with sectionSettings
    const languagesHeading = document.getElementById('languagesHeading');
    const languagesBlock = document.getElementById('languages-block');
    // Only apply default heading if user hasn't customized it
    if (languagesHeading && settings.languages?.heading && !languagesHeading.hasAttribute('data-customized')) {
      languagesHeading.textContent = settings.languages.heading;
    }
    if (languagesBlock) {
      languagesBlock.style.display = settings.languages?.visible !== false ? 'block' : 'none';
    }
    
    if (payload.languages && Array.isArray(payload.languages)) {
      const languagesContainer = document.getElementById('languagesContainer');
      languagesContainer.innerHTML = '';
      payload.languages.forEach(lang => {
        const li = document.createElement('li');
        li.textContent = typeof lang === 'string' ? lang : (lang.name || '');
        languagesContainer.appendChild(li);
      });
    }

    // Awards with sectionSettings
    const awardsHeading = document.getElementById('awardsHeading');
    const awardsBlock = document.getElementById('awards-block');
    // Only apply default heading if user hasn't customized it
    if (awardsHeading && settings.awards?.heading && !awardsHeading.hasAttribute('data-customized')) {
      awardsHeading.textContent = settings.awards.heading;
    }
    if (awardsBlock) {
      awardsBlock.style.display = settings.awards?.visible !== false ? 'block' : 'none';
    }
    
    if (payload.awards && Array.isArray(payload.awards)) {
      const awardsContainer = document.getElementById('awardsContainer');
      awardsContainer.innerHTML = '';
      payload.awards.forEach(award => {
        const li = document.createElement('li');
        li.textContent = `${award.title || ''}${award.year ? ` (${award.year})` : ''}`.trim();
        awardsContainer.appendChild(li);
      });
    }

    // Experience with sectionSettings
    const experienceHeading = document.getElementById('experienceHeading');
    const experienceBlock = document.getElementById('experience-block');
    // Only apply default heading if user hasn't customized it
    if (experienceHeading && settings.experience?.heading && !experienceHeading.hasAttribute('data-customized')) {
      experienceHeading.textContent = settings.experience.heading;
    }
    if (experienceBlock) {
      experienceBlock.style.display = settings.experience?.visible !== false ? 'block' : 'none';
    }
    
    if (payload.experiences && Array.isArray(payload.experiences)) {
      const experienceContainer = document.getElementById('experienceContainer');
      experienceContainer.innerHTML = '';
      payload.experiences.forEach(exp => {
        const item = document.createElement('div');
        item.className = 'item';
        const duration = exp.startDate ? exp.startDate + (exp.endDate ? ' - ' + exp.endDate : '') : '';
        let bulletHTML = '';
        if (exp.bullets && Array.isArray(exp.bullets)) {
          bulletHTML = '<ul>' + exp.bullets.map(b => `<li>${b}</li>`).join('') + '</ul>';
        }
        item.innerHTML = `
          <div class="row">
            <strong>${exp.company || ''}</strong>
            <span>${duration}</span>
          </div>
          ${exp.position ? `<p>${exp.position}</p>` : ''}
          ${exp.description ? `<p>${exp.description.replace(/\n/g, '<br>')}</p>` : ''}
          ${bulletHTML}
        `;
        experienceContainer.appendChild(item);
      });
    }

    // References with sectionSettings
    const referencesHeading = document.getElementById('referencesHeading');
    const referencesBlock = document.getElementById('references-block');
    // Only apply default heading if user hasn't customized it
    if (referencesHeading && settings.references?.heading && !referencesHeading.hasAttribute('data-customized')) {
      referencesHeading.textContent = settings.references.heading;
    }
    if (referencesBlock) {
      referencesBlock.style.display = settings.references?.visible !== false ? 'block' : 'none';
    }
    
    if (payload.references && Array.isArray(payload.references)) {
      const referencesContainer = document.getElementById('referencesContainer');
      referencesContainer.innerHTML = '';
      payload.references.forEach(ref => {
        const item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = `
          <strong>${ref.name || ''}</strong>
          <p>${ref.title || ''}${ref.company ? ` at ${ref.company}` : ''}</p>
          <p>${[ref.email, ref.phone].filter(Boolean).join(' • ')}</p>
        `;
        referencesContainer.appendChild(item);
      });
    }

    // Custom Sections (Drew-Feig Style)
    const customContainer = document.getElementById('customSectionsContainer');
    customContainer.innerHTML = '';
    if (Array.isArray(payload.customSections)) {
      payload.customSections.forEach(section => {
        const wrapper = document.createElement('section');
        wrapper.style.marginTop = '16px';
        
        const heading = document.createElement('h3');
        heading.textContent = settings.custom?.heading || section.heading || 'Custom Section';
        heading.style.margin = '0 0 10px 0';
        
        const content = document.createElement('div');
        content.innerHTML = (section.content || '').replace(/\n/g, '<br>');
        
        wrapper.appendChild(heading);
        wrapper.appendChild(content);
        customContainer.appendChild(wrapper);
      });
    }
    
    // Custom Sections visibility
    if (customContainer) {
      customContainer.style.display = settings.custom?.visible !== false ? 'block' : 'none';
    }

    // Column placement (move sections between left/right)
    const leftColumn = document.querySelector('.left');
    const rightColumn = document.querySelector('.right');
    if (leftColumn && rightColumn) {
      const moveSection = (sectionId, toLeft) => {
        const section = document.getElementById(sectionId);
        if (section && section.parentElement) {
          (toLeft ? leftColumn : rightColumn).appendChild(section);
        }
      };
      
      // Move sections based on column settings
      moveSection('education-block', settings.education?.column === 'left');
      moveSection('skills-block', settings.skills?.column === 'left');
      moveSection('projects-block', settings.projects?.column === 'left');
      moveSection('languages-block', settings.languages?.column === 'left');
      moveSection('awards-block', settings.awards?.column === 'left');
      moveSection('experience-block', settings.experience?.column === 'left');
      moveSection('references-block', settings.references?.column === 'left');
      
      // Position custom sections in the appropriate column
      if (customContainer) {
        const targetColumn = settings.custom?.column === 'left' ? leftColumn : rightColumn;
        if (targetColumn) {
          targetColumn.appendChild(customContainer);
        }
      }
    }
  }

  // Handle inline editing for headings
  document.addEventListener('input', function(e) {
    if (e.target.hasAttribute('contenteditable') && e.target.hasAttribute('data-field')) {
      const field = e.target.getAttribute('data-field');
      const value = e.target.textContent.trim();
      
      // Mark this heading as customized
      e.target.setAttribute('data-customized', 'true');
      
      // Send updated heading to parent
      window.parent.postMessage({
        type: 'heading-update',
        field: field,
        value: value
      }, '*');
    }
  });

  // Prevent Enter key from creating new lines in headings
  document.addEventListener('keydown', function(e) {
    if (e.target.hasAttribute('contenteditable') && e.key === 'Enter') {
      e.preventDefault();
      e.target.blur();
    }
  });

  // Handle postMessage from parent (React editor)
  window.addEventListener('message', (event) => {
    if (event.data.type === 'UPDATE_CONTENT') {
      updateContent(event.data);
    } else if (event.data === 'DOWNLOAD_PDF') {
      // Ensure theme colors are applied before PDF generation
      if (window.currentTheme) {
        const theme = window.currentTheme;
        if (theme.primaryColor) {
          document.documentElement.style.setProperty('--primary-color', theme.primaryColor);
        }
        if (theme.backgroundColor) {
          document.documentElement.style.setProperty('--background-color', theme.backgroundColor);
        }
        if (theme.textColor) {
          document.documentElement.style.setProperty('--text-color', theme.textColor);
        }
        if (theme.textSecondary) {
          document.documentElement.style.setProperty('--text-secondary', theme.textSecondary);
        }
        if (theme.borderColor) {
          document.documentElement.style.setProperty('--border-color', theme.borderColor);
        }
        if (theme.lineColor) {
          document.documentElement.style.setProperty('--line-color', theme.lineColor);
        }
      }
      
      const resume = document.querySelector('.resume');
      
      // Apply background color with higher priority for PDF generation
      if (window.currentTheme && window.currentTheme.backgroundColor) {
        const bgColor = window.currentTheme.backgroundColor;
        resume.style.backgroundColor = bgColor;
        resume.style.setProperty('background-color', bgColor, 'important');
        
        // Also apply to body if needed
        document.body.style.backgroundColor = bgColor;
        document.body.style.setProperty('background-color', bgColor, 'important');
      }
      
      // Small delay to ensure styles are applied before PDF generation
      setTimeout(() => {
        const opt = {
          margin: 0,
          filename: 'resume.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(resume).save();
      }, 100);
    }
  });
</script>

</body>
</html>
