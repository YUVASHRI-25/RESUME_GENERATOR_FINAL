<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avery Gold</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Lato:wght@300;400;700&family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Merriweather:wght@300;400;700&family=Montserrat:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="resume">

  <!-- HEADER -->
  <header>
    <h1 id="name">Avery Davis</h1>
    <h2 id="title">Web Designer</h2>

    <div class="contact-box">
      <div><i class="fa-solid fa-envelope"></i> <span id="email"></span></div>
      <div><i class="fa-solid fa-phone"></i> <span id="phone"></span></div>
      <div><i class="fa-solid fa-globe"></i> <span id="website"></span></div>
    </div>

    <p class="summary" id="summary"></p>
  </header>

  <!-- EXPERIENCE -->
  <section>
    <div class="section-title">
      <h3 id="experienceHeading">EXPERIENCE</h3>
      <span class="line"></span>
    </div>
    <div id="experienceContainer"></div>
  </section>

  <!-- EDUCATION -->
  <section>
    <div class="section-title">
      <h3 id="educationHeading">EDUCATION</h3>
      <span class="line"></span>
    </div>
    <div id="educationContainer"></div>
  </section>

  <!-- SKILLS -->
  <section>
    <div class="section-title">
      <h3 id="skillsHeading">SKILLS</h3>
      <span class="line"></span>
    </div>
    <div class="skills" id="skillsContainer"></div>
  </section>

  <!-- PROJECTS -->
  <section>
    <div class="section-title">
      <h3 id="projectsHeading">PROJECTS</h3>
      <span class="line"></span>
    </div>
    <div id="projectsContainer"></div>
  </section>

  <!-- LANGUAGES -->
  <section>
    <div class="section-title">
      <h3 id="languagesHeading">LANGUAGES</h3>
      <span class="line"></span>
    </div>
    <div id="languagesContainer"></div>
  </section>

  <!-- AWARDS -->
  <section>
    <div class="section-title">
      <h3 id="awardsHeading">AWARDS</h3>
      <span class="line"></span>
    </div>
    <div id="awardsContainer"></div>
  </section>

  <!-- REFERENCES -->
  <section>
    <div class="section-title">
      <h3 id="referencesHeading">REFERENCES</h3>
      <span class="line"></span>
    </div>
    <div id="referencesContainer"></div>
  </section>

  <!-- CUSTOM SECTIONS -->
  <div id="customSectionsContainer"></div>

</div>

<script>
  function updateContent(data) {
    if (!data || !data.payload) return;
    
    const payload = data.payload;
    const settings = payload.sectionSettings || {};

    // Apply font
    const font = payload.fontFamily || 'Inter';
    const fontValue = `'${font}', sans-serif`;
    document.documentElement.style.setProperty('--resume-font', fontValue);
    const resume = document.querySelector('.resume');
    if (resume) resume.style.fontFamily = fontValue;

    // Apply theme colors
    if (payload.theme) {
      window.currentTheme = payload.theme; // Store for PDF generation
      const theme = payload.theme;
      if (theme.primaryColor) {
        document.documentElement.style.setProperty('--primary-color', theme.primaryColor);
        document.documentElement.style.setProperty('--gold', theme.primaryColor);
      }
      if (theme.backgroundColor) {
        document.documentElement.style.setProperty('--background-color', theme.backgroundColor);
      }
      if (theme.textColor) {
        document.documentElement.style.setProperty('--text-color', theme.textColor);
      }
      if (theme.textSecondary) {
        document.documentElement.style.setProperty('--text-secondary', theme.textSecondary);
      }
      if (theme.borderColor) {
        document.documentElement.style.setProperty('--border-color', theme.borderColor);
      }
    }

    // Personal info
    if (payload.personalInfo) {
      document.getElementById('name').textContent = payload.personalInfo.name || '';
      document.getElementById('title').textContent = payload.personalInfo.title || '';
      document.getElementById('email').textContent = payload.personalInfo.email || '';
      document.getElementById('phone').textContent = payload.personalInfo.phone || '';
      document.getElementById('website').textContent = payload.personalInfo.website || '';
      document.getElementById('summary').textContent = payload.personalInfo.summary || '';
    }

    // Experience
    const expHeading = document.getElementById('experienceHeading');
    const expSection = expHeading?.closest('section');
    if (expHeading && settings.experience?.heading) {
      expHeading.textContent = settings.experience.heading;
    }
    if (expSection) {
      expSection.style.display = settings.experience?.visible !== false ? 'block' : 'none';
    }
    if (payload.experiences && Array.isArray(payload.experiences)) {
      const experienceContainer = document.getElementById('experienceContainer');
      experienceContainer.innerHTML = '';
      payload.experiences.forEach(exp => {
        const timeline = document.createElement('div');
        timeline.className = 'timeline';
        const duration = exp.startDate ? exp.startDate + (exp.endDate ? ' - ' + exp.endDate : '') : '';
        let bulletHTML = '';
        if (exp.bullets && Array.isArray(exp.bullets)) {
          bulletHTML = '<ul>' + exp.bullets.map(b => `<li>${b}</li>`).join('') + '</ul>';
        }
        timeline.innerHTML = `
          <div class="dot"></div>
          <div class="content">
            <div class="row">
              <strong>${exp.position || ''}</strong>
              <span>${duration}</span>
            </div>
            ${bulletHTML}
          </div>
        `;
        experienceContainer.appendChild(timeline);
      });
    }

    // Education
    const eduHeading = document.getElementById('educationHeading');
    const eduSection = eduHeading?.closest('section');
    if (eduHeading && settings.education?.heading) {
      eduHeading.textContent = settings.education.heading;
    }
    if (eduSection) {
      eduSection.style.display = settings.education?.visible !== false ? 'block' : 'none';
    }
    if (payload.education && Array.isArray(payload.education)) {
      const educationContainer = document.getElementById('educationContainer');
      educationContainer.innerHTML = '';
      payload.education.forEach(edu => {
        const timeline = document.createElement('div');
        timeline.className = 'timeline';
        const year = edu.startDate ? edu.startDate + (edu.endDate ? ' - ' + edu.endDate : '') : '';
        let bulletHTML = '';
        if (edu.bullets && Array.isArray(edu.bullets)) {
          bulletHTML = '<ul>' + edu.bullets.map(b => `<li>${b}</li>`).join('') + '</ul>';
        }
        timeline.innerHTML = `
          <div class="dot"></div>
          <div class="content">
            <div class="row">
              <strong>${edu.degree || ''}</strong>
              <span>${year}</span>
            </div>
            <div>${edu.school || ''}</div>
            ${bulletHTML}
          </div>
        `;
        educationContainer.appendChild(timeline);
      });
    }

    // Skills
    const skillsHeading = document.getElementById('skillsHeading');
    const skillsSection = skillsHeading?.closest('section');
    if (skillsHeading && settings.skills?.heading) {
      skillsHeading.textContent = settings.skills.heading;
    }
    if (skillsSection) {
      skillsSection.style.display = settings.skills?.visible !== false ? 'block' : 'none';
    }
    if (payload.skills && Array.isArray(payload.skills)) {
      const skillsContainer = document.getElementById('skillsContainer');
      skillsContainer.innerHTML = '';
      
      // Split skills into two columns
      const halfLength = Math.ceil(payload.skills.length / 2);
      const skillsLeft = payload.skills.slice(0, halfLength);
      const skillsRight = payload.skills.slice(halfLength);
      
      const leftUl = document.createElement('ul');
      skillsLeft.forEach(skill => {
        const li = document.createElement('li');
        li.textContent = typeof skill === 'string' ? skill : (skill.name || '');
        leftUl.appendChild(li);
      });
      skillsContainer.appendChild(leftUl);
      
      const rightUl = document.createElement('ul');
      skillsRight.forEach(skill => {
        const li = document.createElement('li');
        li.textContent = typeof skill === 'string' ? skill : (skill.name || '');
        rightUl.appendChild(li);
      });
      skillsContainer.appendChild(rightUl);
    }

    // Projects Section
    const projectsHeading = document.getElementById('projectsHeading');
    const projectsSection = projectsHeading?.closest('section');
    if (projectsHeading && settings.projects?.heading) {
      projectsHeading.textContent = settings.projects.heading;
    }
    if (projectsSection) {
      projectsSection.style.display = settings.projects?.visible !== false ? 'block' : 'none';
    }
    if (payload.projects && Array.isArray(payload.projects)) {
      const projectsContainer = document.getElementById('projectsContainer');
      projectsContainer.innerHTML = '';
      payload.projects.forEach(proj => {
        const timeline = document.createElement('div');
        timeline.className = 'timeline';
        let bulletHTML = '';
        if (proj.bullets && Array.isArray(proj.bullets)) {
          bulletHTML = '<ul>' + proj.bullets.map(b => `<li>${b}</li>`).join('') + '</ul>';
        }
        timeline.innerHTML = `
          <div class="dot"></div>
          <div class="content">
            <div class="row">
              <strong>${proj.title || proj.name || ''}</strong>
            </div>
            <div>${proj.description || ''}</div>
            ${bulletHTML}
          </div>
        `;
        projectsContainer.appendChild(timeline);
      });
    }

    // Languages Section
    const langHeading = document.getElementById('languagesHeading');
    const langSection = langHeading?.closest('section');
    if (langHeading && settings.languages?.heading) {
      langHeading.textContent = settings.languages.heading;
    }
    if (langSection) {
      langSection.style.display = settings.languages?.visible !== false ? 'block' : 'none';
    }
    if (payload.languages && Array.isArray(payload.languages)) {
      const languagesContainer = document.getElementById('languagesContainer');
      languagesContainer.innerHTML = '';
      payload.languages.forEach(lang => {
        const timeline = document.createElement('div');
        timeline.className = 'timeline';
        timeline.innerHTML = `
          <div class="dot"></div>
          <div class="content">
            <div class="row">
              <strong>${lang.name || 'Language'}</strong>
              <span>${lang.level || 'Fluent'}</span>
            </div>
          </div>
        `;
        languagesContainer.appendChild(timeline);
      });
    }

    // Awards Section
    const awardsHeading = document.getElementById('awardsHeading');
    const awardsSection = awardsHeading?.closest('section');
    if (awardsHeading && settings.awards?.heading) {
      awardsHeading.textContent = settings.awards.heading;
    }
    if (awardsSection) {
      awardsSection.style.display = settings.awards?.visible !== false ? 'block' : 'none';
    }
    if (payload.awards && Array.isArray(payload.awards)) {
      const awardsContainer = document.getElementById('awardsContainer');
      awardsContainer.innerHTML = '';
      payload.awards.forEach(award => {
        const timeline = document.createElement('div');
        timeline.className = 'timeline';
        timeline.innerHTML = `
          <div class="dot"></div>
          <div class="content">
            <div class="row">
              <strong>${award.title || award.name || ''}</strong>
              <span>${award.date || award.year || ''}</span>
            </div>
            <div>${award.issuer || award.organization || ''}</div>
          </div>
        `;
        awardsContainer.appendChild(timeline);
      });
    }

    // References Section
    const refHeading = document.getElementById('referencesHeading');
    const refSection = refHeading?.closest('section');
    if (refHeading && settings.references?.heading) {
      refHeading.textContent = settings.references.heading;
    }
    if (refSection) {
      refSection.style.display = settings.references?.visible !== false ? 'block' : 'none';
    }
    if (payload.references && Array.isArray(payload.references)) {
      const referencesContainer = document.getElementById('referencesContainer');
      referencesContainer.innerHTML = '';
      payload.references.forEach(ref => {
        const timeline = document.createElement('div');
        timeline.className = 'timeline';
        const contactItems = [];
        if (ref.email) contactItems.push(ref.email);
        if (ref.phone) contactItems.push(ref.phone);
        timeline.innerHTML = `
          <div class="dot"></div>
          <div class="content">
            <div class="row">
              <strong>${ref.name || ''}</strong>
            </div>
            <div>${ref.title || ''}</div>
            <div>${ref.company || ''}</div>
            <div>${contactItems.join(' • ')}</div>
          </div>
        `;
        referencesContainer.appendChild(timeline);
      });
    }

    // Custom Sections
    const customContainer = document.getElementById('customSectionsContainer');
    customContainer.innerHTML = '';
    if (Array.isArray(payload.customSections)) {
      payload.customSections.forEach(section => {
        const wrapper = document.createElement('section');
        wrapper.style.marginTop = '16px';
        
        const heading = document.createElement('h3');
        heading.textContent = settings.custom?.heading || section.heading || 'Custom Section';
        heading.style.margin = '0 0 10px 0';
        
        const content = document.createElement('div');
        content.textContent = section.content || '';
        
        wrapper.appendChild(heading);
        wrapper.appendChild(content);
        customContainer.appendChild(wrapper);
      });
    }
    
    // Custom Sections visibility
    if (customContainer) {
      customContainer.style.display = settings.custom?.visible !== false ? 'block' : 'none';
    }
  }

  // Handle postMessage from parent (React editor)
  window.addEventListener('message', (event) => {
    if (event.data === 'DOWNLOAD_PDF') {
      const resume = document.querySelector('.resume');
      
      // Apply background color with higher priority for PDF generation
      if (window.currentTheme && window.currentTheme.backgroundColor) {
        const bgColor = window.currentTheme.backgroundColor;
        resume.style.backgroundColor = bgColor;
        resume.style.setProperty('background-color', bgColor, 'important');
        
        // Also apply to body if needed
        document.body.style.backgroundColor = bgColor;
        document.body.style.setProperty('background-color', bgColor, 'important');
      }
      
      // Small delay to ensure styles are applied before PDF generation
      setTimeout(() => {
        const opt = {
          margin: 0,
          filename: 'resume.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(resume).save();
      }, 100);
      return;
    }
    updateContent(event.data);
  });

  // Signal that the iframe is ready
  window.parent.postMessage({ type: 'template-ready' }, '*');
</script>

</body>
</html>
