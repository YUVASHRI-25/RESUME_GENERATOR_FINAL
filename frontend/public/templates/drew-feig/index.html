<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <title>Drew Feig</title>
</head>
<body>
  <div id="resume" class="resume template-root">
    <header>
      <h1 id="name">Your Name</h1>
      <h2 id="title">Your Title</h2>
      <div class="contact" id="contact">
        <span id="email"></span>
        <span id="phone"></span>
        <span id="location"></span>
      </div>
    </header>

    <section id="about-section">
      <h3 id="about-heading">About Me</h3>
      <p id="about-content"></p>
    </section>

    <section class="two-col" id="skills-section">
      <div>
        <h3 id="skills-heading">Skills</h3>
        <ul id="skills-list"></ul>
      </div>
    </section>

    <section id="education-section">
      <h3 id="education-heading">Education</h3>
      <div id="education-content"></div>
    </section>

    <section id="experience-section">
      <h3 id="experience-heading">Work Experience</h3>
      <div id="experience-content"></div>
    </section>

    <section id="projects-section">
      <h3 id="projects-heading">Projects</h3>
      <div id="projects-content"></div>
    </section>

    <section id="languages-section">
      <h3 id="languages-heading">Languages</h3>
      <div id="languages-content"></div>
    </section>

    <section id="awards-section">
      <h3 id="awards-heading">Awards</h3>
      <div id="awards-content"></div>
    </section>

    <section id="references-section">
      <h3 id="references-heading">References</h3>
      <div id="references-content"></div>
    </section>

    <div id="custom-sections-container"></div>
  </div>

  <script>
    function updateContent(data) {
      if (!data || !data.payload) return;
      
      const payload = data.payload;
      const settings = payload.sectionSettings || {};

      // Apply font
      const font = payload.fontFamily || 'Inter';
      const fontValue = `'${font}', sans-serif`;
      document.documentElement.style.setProperty('--resume-font', fontValue);
      document.body.style.fontFamily = fontValue;

      // Personal Info Header
      if (payload.personalInfo) {
        const { fullName, title, email, phone, location, website } = payload.personalInfo;
        if (fullName) document.getElementById('name').textContent = fullName.toUpperCase();
        if (title) document.getElementById('title').textContent = title.toUpperCase();
        
        const contactDiv = document.getElementById('contact');
        contactDiv.innerHTML = '';
        if (email) {
          const span = document.createElement('span');
          span.textContent = email;
          span.id = 'email';
          contactDiv.appendChild(span);
        }
        if (phone) {
          const span = document.createElement('span');
          span.textContent = phone;
          span.id = 'phone';
          contactDiv.appendChild(span);
        }
        if (location) {
          const span = document.createElement('span');
          span.textContent = location;
          span.id = 'location';
          contactDiv.appendChild(span);
        }
        if (website) {
          const span = document.createElement('span');
          span.textContent = website;
          contactDiv.appendChild(span);
        }
      }

      // About Section
      const aboutSection = document.getElementById('about-section');
      const aboutHeading = document.getElementById('about-heading');
      if (aboutHeading && settings.about?.heading) {
        aboutHeading.textContent = settings.about.heading;
      }
      if (payload.about?.content) {
        document.getElementById('about-content').textContent = payload.about.content;
      }
      if (aboutSection) {
        aboutSection.style.display = settings.about?.visible !== false ? 'block' : 'none';
      }

      // Skills Section
      const skillsSection = document.getElementById('skills-section');
      const skillsHeading = document.getElementById('skills-heading');
      if (skillsHeading && settings.skills?.heading) {
        skillsHeading.textContent = settings.skills.heading;
      }
      if (skillsSection) {
        skillsSection.style.display = settings.skills?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.skills)) {
        const list = document.getElementById('skills-list');
        list.innerHTML = '';
        payload.skills.forEach(skill => {
          const li = document.createElement('li');
          li.textContent = skill.name || skill;
          list.appendChild(li);
        });
      }

      // Education Section
      const eduSection = document.getElementById('education-section');
      const eduHeading = document.getElementById('education-heading');
      if (eduHeading && settings.education?.heading) {
        eduHeading.textContent = settings.education.heading;
      }
      if (eduSection) {
        eduSection.style.display = settings.education?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.education)) {
        const content = document.getElementById('education-content');
        content.innerHTML = '';
        payload.education.forEach(edu => {
          const div = document.createElement('div');
          div.style.marginBottom = '12px';
          
          const title = document.createElement('p');
          title.style.fontWeight = 'bold';
          title.style.margin = '0 0 4px 0';
          title.textContent = `${edu.degree || ''} ${edu.field ? `in ${edu.field}` : ''}`.trim() || 'Education';
          
          const school = document.createElement('p');
          school.style.margin = '0 0 4px 0';
          school.textContent = edu.school || '';
          
          const dates = document.createElement('p');
          dates.style.fontSize = '12px';
          dates.style.margin = '0';
          dates.textContent = `${edu.startDate || ''} ${edu.endDate ? `- ${edu.endDate}` : ''}`.trim();
          
          div.appendChild(title);
          if (school.textContent) div.appendChild(school);
          if (dates.textContent) div.appendChild(dates);
          if (edu.description) {
            const desc = document.createElement('p');
            desc.style.margin = '4px 0 0 0';
            desc.textContent = edu.description;
            div.appendChild(desc);
          }
          content.appendChild(div);
        });
      }

      // Experience Section
      const expSection = document.getElementById('experience-section');
      const expHeading = document.getElementById('experience-heading');
      if (expHeading && settings.experience?.heading) {
        expHeading.textContent = settings.experience.heading;
      }
      if (expSection) {
        expSection.style.display = settings.experience?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.experiences)) {
        const content = document.getElementById('experience-content');
        content.innerHTML = '';
        payload.experiences.forEach(exp => {
          const div = document.createElement('div');
          div.style.marginBottom = '14px';
          
          const title = document.createElement('p');
          title.style.fontWeight = 'bold';
          title.style.margin = '0 0 4px 0';
          title.textContent = `${exp.position || ''} at ${exp.company || ''}`.trim() || 'Position';
          
          const dates = document.createElement('p');
          dates.style.fontSize = '12px';
          dates.style.margin = '0 0 6px 0';
          dates.textContent = `${exp.startDate || ''} ${exp.endDate ? `- ${exp.endDate}` : exp.currentlyWorking ? '- Present' : ''}`.trim();
          
          div.appendChild(title);
          if (dates.textContent) div.appendChild(dates);
          
          if (exp.description) {
            const desc = document.createElement('p');
            desc.style.margin = '0 0 4px 0';
            desc.textContent = exp.description;
            div.appendChild(desc);
          }
          
          if (Array.isArray(exp.bullets)) {
            const ul = document.createElement('ul');
            ul.style.margin = '4px 0 0 0';
            ul.style.paddingLeft = '20px';
            exp.bullets.forEach(bullet => {
              const li = document.createElement('li');
              li.textContent = bullet;
              ul.appendChild(li);
            });
            div.appendChild(ul);
          }
          
          content.appendChild(div);
        });
      }

      // Projects Section
      const projSection = document.getElementById('projects-section');
      const projHeading = document.getElementById('projects-heading');
      if (projHeading && settings.projects?.heading) {
        projHeading.textContent = settings.projects.heading;
      }
      if (projSection) {
        projSection.style.display = settings.projects?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.projects)) {
        const content = document.getElementById('projects-content');
        content.innerHTML = '';
        payload.projects.forEach(proj => {
          const div = document.createElement('div');
          div.style.marginBottom = '12px';
          
          const title = document.createElement('p');
          title.style.fontWeight = 'bold';
          title.style.margin = '0 0 4px 0';
          title.textContent = proj.title || 'Project';
          
          const desc = document.createElement('p');
          desc.style.margin = '0';
          desc.textContent = proj.description || '';
          
          div.appendChild(title);
          if (desc.textContent) div.appendChild(desc);
          content.appendChild(div);
        });
      }

      // Languages Section
      const langSection = document.getElementById('languages-section');
      const langHeading = document.getElementById('languages-heading');
      if (langHeading && settings.languages?.heading) {
        langHeading.textContent = settings.languages.heading;
      }
      if (langSection) {
        langSection.style.display = settings.languages?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.languages)) {
        const content = document.getElementById('languages-content');
        content.innerHTML = '';
        payload.languages.forEach(lang => {
          const div = document.createElement('div');
          div.style.marginBottom = '6px';
          div.textContent = `${lang.name || 'Language'} – ${lang.level || 'Fluent'}`;
          content.appendChild(div);
        });
      }

      // Awards Section
      const awardSection = document.getElementById('awards-section');
      const awardHeading = document.getElementById('awards-heading');
      if (awardHeading && settings.awards?.heading) {
        awardHeading.textContent = settings.awards.heading;
      }
      if (awardSection) {
        awardSection.style.display = settings.awards?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.awards)) {
        const content = document.getElementById('awards-content');
        content.innerHTML = '';
        payload.awards.forEach(award => {
          const div = document.createElement('div');
          div.style.marginBottom = '10px';
          
          const title = document.createElement('p');
          title.style.fontWeight = 'bold';
          title.style.margin = '0 0 2px 0';
          title.textContent = award.title || 'Award';
          
          const issuer = document.createElement('p');
          issuer.style.margin = '0';
          issuer.textContent = `${award.issuer || ''} ${award.date ? `- ${award.date}` : ''}`.trim();
          
          div.appendChild(title);
          if (issuer.textContent) div.appendChild(issuer);
          if (award.description) {
            const desc = document.createElement('p');
            desc.style.margin = '4px 0 0 0';
            desc.style.fontSize = '12px';
            desc.textContent = award.description;
            div.appendChild(desc);
          }
          content.appendChild(div);
        });
      }

      // References Section
      const refSection = document.getElementById('references-section');
      const refHeading = document.getElementById('references-heading');
      if (refHeading && settings.references?.heading) {
        refHeading.textContent = settings.references.heading;
      }
      if (refSection) {
        refSection.style.display = settings.references?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.references)) {
        const content = document.getElementById('references-content');
        content.innerHTML = '';
        payload.references.forEach(ref => {
          const div = document.createElement('div');
          div.style.marginBottom = '10px';
          
          const name = document.createElement('p');
          name.style.fontWeight = 'bold';
          name.style.margin = '0 0 2px 0';
          name.textContent = ref.name || 'Reference';
          
          const info = document.createElement('p');
          info.style.margin = '0';
          info.textContent = `${ref.title || ''} ${ref.company ? `at ${ref.company}` : ''}`.trim();
          
          const contact = document.createElement('p');
          contact.style.fontSize = '12px';
          contact.style.margin = '2px 0 0 0';
          const contactItems = [];
          if (ref.email) contactItems.push(ref.email);
          if (ref.phone) contactItems.push(ref.phone);
          contact.textContent = contactItems.join(' • ');
          
          div.appendChild(name);
          if (info.textContent) div.appendChild(info);
          if (contact.textContent) div.appendChild(contact);
          content.appendChild(div);
        });
      }

      // Custom Sections
      const customContainer = document.getElementById('custom-sections-container');
      customContainer.innerHTML = '';
      if (Array.isArray(payload.customSections)) {
        payload.customSections.forEach(section => {
          const wrapper = document.createElement('section');
          wrapper.style.marginTop = '16px';
          
          const heading = document.createElement('h3');
          heading.textContent = section.heading || 'Custom Section';
          heading.style.margin = '0 0 10px 0';
          
          const content = document.createElement('div');
          content.textContent = section.content || '';
          
          wrapper.appendChild(heading);
          wrapper.appendChild(content);
          customContainer.appendChild(wrapper);
        });
      }
    }

    window.addEventListener('message', (event) => {
      if (event.data === 'DOWNLOAD_PDF') {
        const resume = document.getElementById('resume');
        const opt = {
          margin: 0,
          filename: 'resume.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(resume).save();
        return;
      }
      updateContent(event.data);
    });

    window.parent.postMessage({ type: 'template-ready' }, '*');
  </script>
</body>
</html>
