<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Lato:wght@300;400;700&family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Merriweather:wght@300;400;700&family=Montserrat:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <title>Drew Feig</title>
</head>
<body>
  <div id="resume" class="resume template-root">
    <header>
      <div class="header-top">
        <h1 id="name" contenteditable="true" data-field="name"></h1>
        <h2 id="title" contenteditable="true" data-field="title"></h2>
      </div>
      <div class="contact" id="contact">
        <span id="email" contenteditable="true" data-field="email"></span>
        <span id="phone" contenteditable="true" data-field="phone"></span>
        <span id="location" contenteditable="true" data-field="location"></span>
      </div>
    </header>

    <section id="about-section">
      <h3 id="about-heading" contenteditable="true" data-field="aboutHeading"></h3>
      <p id="about-content" contenteditable="true" data-field="aboutContent"></p>
    </section>

    <section class="two-col" id="skills-section">
      <div>
        <h3 id="skills-heading" contenteditable="true" data-field="skillsHeading"></h3>
        <ul id="skills-list"></ul>
      </div>
    </section>

    <section id="education-section">
      <h3 id="education-heading" contenteditable="true" data-field="educationHeading"></h3>
      <div id="education-content"></div>
    </section>

    <section id="experience-section">
      <h3 id="experience-heading" contenteditable="true" data-field="experienceHeading"></h3>
      <div id="experience-content"></div>
    </section>

    <section id="projects-section">
      <h3 id="projects-heading" contenteditable="true" data-field="projectsHeading"></h3>
      <div id="projects-content"></div>
    </section>

    <section id="languages-section">
      <h3 id="languages-heading" contenteditable="true" data-field="languagesHeading"></h3>
      <div id="languages-content"></div>
    </section>

    <section id="awards-section">
      <h3 id="awards-heading" contenteditable="true" data-field="awardsHeading"></h3>
      <div id="awards-content"></div>
    </section>

    <section id="references-section">
      <h3 id="references-heading" contenteditable="true" data-field="referencesHeading"></h3>
      <div id="references-content"></div>
    </section>

    <div id="custom-sections-container"></div>
  </div>

  <script>
    // WYSIWYG Text Formatting Functions
    function applyFormat(formatType, value = null) {
      const selection = window.getSelection();
      if (!selection.rangeCount || selection.isCollapsed) {
        return; // No text selected
      }

      const range = selection.getRangeAt(0);
      const selectedText = range.toString();
      
      if (!selectedText.trim()) {
        return; // No meaningful text selected
      }

      switch (formatType) {
        case 'bold':
          wrapSelection('strong');
          break;
        case 'italic':
          wrapSelection('em');
          break;
        case 'underline':
          wrapSelection('u');
          break;
        case 'fontSize':
          const fontSizeMap = {
            '1': '10px',
            '2': '12px', 
            '3': '14px',
            '4': '16px',
            '5': '18px',
            '6': '24px',
            '7': '32px'
          };
          const actualSize = fontSizeMap[value] || value + 'px';
          wrapSelection('span', { style: `font-size: ${actualSize}` });
          break;
        case 'clear':
          clearFormatting();
          break;
      }
      
      // Preserve selection after formatting
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function wrapSelection(tagName, attributes = {}) {
      const selection = window.getSelection();
      if (!selection.rangeCount) return;

      const range = selection.getRangeAt(0);
      const element = document.createElement(tagName);
      
      // Set attributes
      Object.entries(attributes).forEach(([key, value]) => {
        element.setAttribute(key, value);
      });
      
      try {
        range.surroundContents(element);
      } catch (e) {
        // Handle complex selections
        const contents = range.extractContents();
        element.appendChild(contents);
        range.insertNode(element);
      }
    }

    function clearFormatting() {
      document.execCommand('removeFormat', false, null);
    }

    // Handle formatting messages from parent
    window.addEventListener('message', (event) => {
      if (event.data.type === 'APPLY_FORMAT') {
        applyFormat(event.data.formatType, event.data.value);
      }
    });

    // Notify parent when selection changes
    document.addEventListener('selectionchange', () => {
      const selection = window.getSelection();
      const hasSelection = selection.rangeCount > 0 && !selection.isCollapsed && selection.toString().trim();
      
      window.parent.postMessage({
        type: 'SELECTION_CHANGED',
        hasSelection: hasSelection
      }, '*');
    });

    function updateContent(data) {
      if (!data || !data.payload) return;
      
      const payload = data.payload;
      const settings = payload.sectionSettings || {};

      // Apply font
      const font = payload.fontFamily || 'Inter';
      const fontValue = `'${font}', sans-serif`;
      document.documentElement.style.setProperty('--resume-font', fontValue);
      document.body.style.fontFamily = fontValue;

      // Apply theme colors
      if (payload.theme) {
        window.currentTheme = payload.theme; // Store for PDF generation
        console.log('Theme applied to Drew Feig template:', window.currentTheme);
        const theme = payload.theme;
        if (theme.primaryColor) {
          document.documentElement.style.setProperty('--primary-color', theme.primaryColor);
        }
        if (theme.backgroundColor) {
          document.documentElement.style.setProperty('--background-color', theme.backgroundColor);
        }
        if (theme.textColor) {
          document.documentElement.style.setProperty('--text-color', theme.textColor);
        }
        if (theme.textSecondary) {
          document.documentElement.style.setProperty('--text-secondary', theme.textSecondary);
        }
        if (theme.borderColor) {
          document.documentElement.style.setProperty('--border-color', theme.borderColor);
        }
      } else {
        console.log('No theme provided in payload');
      }

      // Personal Info Header
      if (payload.personalInfo) {
        const { fullName, title, email, phone, location, website } = payload.personalInfo;
        if (fullName) document.getElementById('name').textContent = fullName.toUpperCase();
        if (title) document.getElementById('title').textContent = title.toUpperCase();
        
        const contactDiv = document.getElementById('contact');
        contactDiv.innerHTML = '';
        if (email) {
          const span = document.createElement('span');
          span.textContent = email;
          span.id = 'email';
          contactDiv.appendChild(span);
        }
        if (phone) {
          const span = document.createElement('span');
          span.textContent = phone;
          span.id = 'phone';
          contactDiv.appendChild(span);
        }
        if (location) {
          const span = document.createElement('span');
          span.textContent = location;
          span.id = 'location';
          contactDiv.appendChild(span);
        }
        if (website) {
          const span = document.createElement('span');
          span.textContent = website;
          span.id = 'website';
          contactDiv.appendChild(span);
        }
      }

      // About Section
      const aboutSection = document.getElementById('about-section');
      const aboutHeading = document.getElementById('about-heading');
      // Only apply default heading if user hasn't customized it
      if (aboutHeading && settings.about?.heading && !aboutHeading.hasAttribute('data-customized')) {
        aboutHeading.textContent = settings.about.heading;
      }
      if (payload.about?.content) {
        const aboutContent = document.getElementById('about-content');
        aboutContent.innerHTML = payload.about.content.replace(/\n/g, '<br>');
        aboutContent.setAttribute('data-original-content', payload.about.content);
      }
      if (aboutSection) {
        aboutSection.style.display = settings.about?.visible !== false ? 'block' : 'none';
      }

      // Skills Section
      const skillsSection = document.getElementById('skills-section');
      const skillsHeading = document.getElementById('skills-heading');
      // Only apply default heading if user hasn't customized it
      if (skillsHeading && settings.skills?.heading && !skillsHeading.hasAttribute('data-customized')) {
        skillsHeading.textContent = settings.skills.heading;
      }
      if (skillsSection) {
        skillsSection.style.display = settings.skills?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.skills)) {
        const list = document.getElementById('skills-list');
        list.innerHTML = '';
        payload.skills.forEach(skill => {
          const li = document.createElement('li');
          li.textContent = skill.name || skill;
          li.contentEditable = 'true';
          li.setAttribute('data-field', 'skillItem');
          list.appendChild(li);
        });
      }

      // Education Section
      const eduSection = document.getElementById('education-section');
      const eduHeading = document.getElementById('education-heading');
      // Only apply default heading if user hasn't customized it
      if (eduHeading && settings.education?.heading && !eduHeading.hasAttribute('data-customized')) {
        eduHeading.textContent = settings.education.heading;
      }
      if (eduSection) {
        eduSection.style.display = settings.education?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.education)) {
        const content = document.getElementById('education-content');
        content.innerHTML = '';
        payload.education.forEach(edu => {
          const div = document.createElement('div');
          div.className = 'education-item';
          
          const headerDiv = document.createElement('div');
          headerDiv.className = 'item-header';
          
          const title = document.createElement('div');
          title.className = 'item-title';
          title.textContent = `${edu.degree || ''} ${edu.field ? `in ${edu.field}` : ''}`.trim() || 'Education';
          title.contentEditable = 'true';
          title.setAttribute('data-field', 'educationTitle');
          
          const date = document.createElement('div');
          date.className = 'item-date';
          date.textContent = `${edu.startDate || ''} ${edu.endDate ? `- ${edu.endDate}` : ''}`.trim();
          date.contentEditable = 'true';
          date.setAttribute('data-field', 'educationDate');
          
          headerDiv.appendChild(title);
          headerDiv.appendChild(date);
          
          const school = document.createElement('div');
          school.className = 'item-subtitle';
          school.textContent = edu.school || '';
          school.contentEditable = 'true';
          school.setAttribute('data-field', 'educationSchool');
          
          div.appendChild(headerDiv);
          if (school.textContent) div.appendChild(school);
          if (edu.description) {
            const desc = document.createElement('div');
            desc.className = 'item-description';
            desc.innerHTML = edu.description.replace(/\n/g, '<br>');
            desc.contentEditable = 'true';
            desc.setAttribute('data-field', 'educationDescription');
            desc.setAttribute('data-original-content', edu.description);
            div.appendChild(desc);
          }
          content.appendChild(div);
        });
      }

      // Experience Section
      const expSection = document.getElementById('experience-section');
      const expHeading = document.getElementById('experience-heading');
      // Only apply default heading if user hasn't customized it
      if (expHeading && settings.experience?.heading && !expHeading.hasAttribute('data-customized')) {
        expHeading.textContent = settings.experience.heading;
      }
      if (expSection) {
        expSection.style.display = settings.experience?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.experiences)) {
        const content = document.getElementById('experience-content');
        content.innerHTML = '';
        payload.experiences.forEach(exp => {
          const div = document.createElement('div');
          div.className = 'experience-item';
          
          const headerDiv = document.createElement('div');
          headerDiv.className = 'item-header';
          
          const title = document.createElement('div');
          title.className = 'item-title';
          title.contentEditable = 'true';
          title.setAttribute('data-field', 'experienceTitle');
          
          // More flexible title formatting - remove hardcoded "at"
          const position = exp.position || '';
          const company = exp.company || '';
          
          if (position && company) {
            title.textContent = `${position}, ${company}`;
          } else if (position) {
            title.textContent = position;
          } else if (company) {
            title.textContent = company;
          } else {
            title.textContent = 'Position';
          }
          
          const date = document.createElement('div');
          date.className = 'item-date';
          date.textContent = `${exp.startDate || ''} ${exp.endDate ? `- ${exp.endDate}` : exp.currentlyWorking ? '- Present' : ''}`.trim();
          date.contentEditable = 'true';
          date.setAttribute('data-field', 'experienceDate');
          
          headerDiv.appendChild(title);
          headerDiv.appendChild(date);
          
          div.appendChild(headerDiv);
          
          if (exp.description) {
            const desc = document.createElement('div');
            desc.className = 'item-description';
            desc.innerHTML = exp.description.replace(/\n/g, '<br>');
            desc.contentEditable = 'true';
            desc.setAttribute('data-field', 'experienceDescription');
            desc.setAttribute('data-original-content', exp.description);
            div.appendChild(desc);
          }
          
          // Add bullets if they exist
          if (exp.bullets && exp.bullets.length > 0) {
            const ul = document.createElement('ul');
            exp.bullets.forEach(bullet => {
              if (bullet) {
                const li = document.createElement('li');
                li.textContent = bullet;
                li.contentEditable = 'true';
                li.setAttribute('data-field', 'experienceBullet');
                ul.appendChild(li);
              }
            });
            div.appendChild(ul);
          }
          
          content.appendChild(div);
        });
      }

      // Projects Section
      const projSection = document.getElementById('projects-section');
      const projHeading = document.getElementById('projects-heading');
      // Only apply default heading if user hasn't customized it
      if (projHeading && settings.projects?.heading && !projHeading.hasAttribute('data-customized')) {
        projHeading.textContent = settings.projects.heading;
      }
      if (projSection) {
        projSection.style.display = settings.projects?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.projects)) {
        const content = document.getElementById('projects-content');
        content.innerHTML = '';
        payload.projects.forEach(proj => {
          const div = document.createElement('div');
          div.style.marginBottom = '12px';
          
          const title = document.createElement('p');
          title.style.fontWeight = 'bold';
          title.style.margin = '0 0 4px 0';
          title.textContent = proj.title || 'Project';
          title.contentEditable = 'true';
          title.setAttribute('data-field', 'projectTitle');
          
          const desc = document.createElement('p');
          desc.style.margin = '0';
          desc.className = 'project-description';
          desc.innerHTML = (proj.description || '').replace(/\n/g, '<br>');
          desc.contentEditable = 'true';
          desc.setAttribute('data-field', 'projectDescription');
          desc.setAttribute('data-original-content', proj.description || '');
          
          div.appendChild(title);
          if (desc.textContent) div.appendChild(desc);
          
          // Add bullets if they exist
          if (proj.bullets && proj.bullets.length > 0) {
            const ul = document.createElement('ul');
            proj.bullets.forEach(bullet => {
              if (bullet) {
                const li = document.createElement('li');
                li.textContent = bullet;
                li.contentEditable = 'true';
                li.setAttribute('data-field', 'projectBullet');
                ul.appendChild(li);
              }
            });
            div.appendChild(ul);
          }
          
          content.appendChild(div);
        });
      }

      // Languages Section
      const langSection = document.getElementById('languages-section');
      const langHeading = document.getElementById('languages-heading');
      // Only apply default heading if user hasn't customized it
      if (langHeading && settings.languages?.heading && !langHeading.hasAttribute('data-customized')) {
        langHeading.textContent = settings.languages.heading;
      }
      if (langSection) {
        langSection.style.display = settings.languages?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.languages)) {
        const content = document.getElementById('languages-content');
        content.innerHTML = '';
        payload.languages.forEach(lang => {
          const div = document.createElement('div');
          div.style.marginBottom = '6px';
          div.textContent = `${lang.name || 'Language'} – ${lang.level || 'Fluent'}`;
          div.contentEditable = 'true';
          div.setAttribute('data-field', 'languageItem');
          content.appendChild(div);
        });
      }

      // Awards Section
      const awardSection = document.getElementById('awards-section');
      const awardHeading = document.getElementById('awards-heading');
      // Only apply default heading if user hasn't customized it
      if (awardHeading && settings.awards?.heading && !awardHeading.hasAttribute('data-customized')) {
        awardHeading.textContent = settings.awards.heading;
      }
      if (awardSection) {
        awardSection.style.display = settings.awards?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.awards)) {
        const content = document.getElementById('awards-content');
        content.innerHTML = '';
        payload.awards.forEach(award => {
          const div = document.createElement('div');
          div.style.marginBottom = '10px';
          
          const title = document.createElement('p');
          title.style.fontWeight = 'bold';
          title.style.margin = '0 0 2px 0';
          title.textContent = award.title || 'Award';
          title.contentEditable = 'true';
          title.setAttribute('data-field', 'awardTitle');
          
          const issuer = document.createElement('p');
          issuer.style.margin = '0';
          issuer.textContent = `${award.issuer || ''} ${award.date ? `- ${award.date}` : ''}`.trim();
          issuer.contentEditable = 'true';
          issuer.setAttribute('data-field', 'awardIssuer');
          
          div.appendChild(title);
          if (issuer.textContent) div.appendChild(issuer);
          if (award.description) {
            const desc = document.createElement('p');
            desc.style.margin = '4px 0 0 0';
            desc.className = 'award-description';
            desc.textContent = award.description;
            desc.contentEditable = 'true';
            desc.setAttribute('data-field', 'awardDescription');
            div.appendChild(desc);
          }
          content.appendChild(div);
        });
      }

      // References Section
      const refSection = document.getElementById('references-section');
      const refHeading = document.getElementById('references-heading');
      // Only apply default heading if user hasn't customized it
      if (refHeading && settings.references?.heading && !refHeading.hasAttribute('data-customized')) {
        refHeading.textContent = settings.references.heading;
      }
      if (refSection) {
        refSection.style.display = settings.references?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.references)) {
        const content = document.getElementById('references-content');
        content.innerHTML = '';
        payload.references.forEach(ref => {
          const div = document.createElement('div');
          div.style.marginBottom = '10px';
          
          const name = document.createElement('p');
          name.style.fontWeight = 'bold';
          name.style.margin = '0 0 2px 0';
          name.textContent = ref.name || 'Reference';
          name.contentEditable = 'true';
          name.setAttribute('data-field', 'referenceName');
          
          const info = document.createElement('p');
          info.style.margin = '0';
          info.contentEditable = 'true';
          info.setAttribute('data-field', 'referenceInfo');
          
          // More flexible reference info formatting - remove hardcoded "at"
          const title = ref.title || '';
          const company = ref.company || '';
          
          if (title && company) {
            info.textContent = `${title}, ${company}`;
          } else if (title) {
            info.textContent = title;
          } else if (company) {
            info.textContent = company;
          } else {
            info.textContent = '';
          }
          
          const contact = document.createElement('p');
          contact.style.fontSize = '12px';
          contact.style.margin = '2px 0 0 0';
          const contactItems = [];
          if (ref.email) contactItems.push(ref.email);
          if (ref.phone) contactItems.push(ref.phone);
          contact.textContent = contactItems.join(' • ');
          contact.contentEditable = 'true';
          contact.setAttribute('data-field', 'referenceContact');
          
          div.appendChild(name);
          if (info.textContent) div.appendChild(info);
          if (contact.textContent) div.appendChild(contact);
          content.appendChild(div);
        });
      }

      // Custom Sections
      const customContainer = document.getElementById('custom-sections-container');
      customContainer.innerHTML = '';
      if (Array.isArray(payload.customSections)) {
        payload.customSections.forEach(section => {
          const wrapper = document.createElement('section');
          wrapper.style.marginTop = '16px';
          
          const heading = document.createElement('h3');
          heading.textContent = settings.custom?.heading || section.heading || 'Custom Section';
          heading.style.margin = '0 0 10px 0';
          heading.contentEditable = 'true';
          heading.setAttribute('data-field', 'customSectionHeading');
          
          const content = document.createElement('div');
          content.className = 'custom-section-content';
          
          // Handle content with bullets
          if (section.bullets && section.bullets.length > 0) {
            // If bullets exist, render description first (if any), then bullets
            if (section.content) {
              const descDiv = document.createElement('div');
              descDiv.innerHTML = section.content.replace(/\n/g, '<br>');
              descDiv.style.marginBottom = '8px';
              descDiv.contentEditable = 'true';
              descDiv.setAttribute('data-field', 'customSectionContent');
              content.appendChild(descDiv);
            }
            
            const ul = document.createElement('ul');
            section.bullets.forEach(bullet => {
              if (bullet) {
                const li = document.createElement('li');
                li.textContent = bullet;
                li.contentEditable = 'true';
                li.setAttribute('data-field', 'customSectionBullet');
                ul.appendChild(li);
              }
            });
            content.appendChild(ul);
          } else {
            // If no bullets, render content as normal
            content.innerHTML = (section.content || '').replace(/\n/g, '<br>');
            content.contentEditable = 'true';
            content.setAttribute('data-field', 'customSectionContent');
          }
          
          wrapper.appendChild(heading);
          wrapper.appendChild(content);
          customContainer.appendChild(wrapper);
        });
      }
      
      // Custom Sections visibility
      if (customContainer) {
        customContainer.style.display = settings.custom?.visible !== false ? 'block' : 'none';
      }
    }

    // Handle inline editing for headings
    document.addEventListener('input', function(e) {
      if (e.target.hasAttribute('contenteditable') && e.target.hasAttribute('data-field')) {
        const field = e.target.getAttribute('data-field');
        const value = e.target.textContent.trim();
        
        // Mark this heading as customized
        e.target.setAttribute('data-customized', 'true');
        
        // Send updated heading to parent
        window.parent.postMessage({
          type: 'heading-update',
          field: field,
          value: value
        }, '*');
      }
    });

    // Prevent Enter key from creating new lines in headings
    document.addEventListener('keydown', function(e) {
      if (e.target.hasAttribute('contenteditable') && e.key === 'Enter') {
        e.preventDefault();
        e.target.blur();
      }
    });

    window.addEventListener('message', (event) => {
      console.log('Drew Feig template received message:', event.data);
      
      if (event.data === 'DOWNLOAD_PDF') {
        console.log('Drew Feig template processing DOWNLOAD_PDF');
        
        const resume = document.getElementById('resume');
        if (!resume) {
          console.error('Resume element not found');
          window.parent.postMessage({ type: 'DOWNLOAD_ERROR', error: 'Resume element not found' }, '*');
          return;
        }
        
        // Apply background color with higher priority for PDF generation
        if (window.currentTheme && window.currentTheme.backgroundColor) {
          const bgColor = window.currentTheme.backgroundColor;
          console.log('Applying background color:', bgColor);
          resume.style.backgroundColor = bgColor;
          resume.style.setProperty('background-color', bgColor, 'important');
          
          // Also apply to body if needed
          document.body.style.backgroundColor = bgColor;
          document.body.style.setProperty('background-color', bgColor, 'important');
        }
        
        // Small delay to ensure styles are applied before PDF generation
        setTimeout(() => {
          try {
            console.log('Starting PDF generation for Drew Feig template');
            const opt = {
              margin: 0,
              filename: 'resume.pdf',
              image: { type: 'jpeg', quality: 0.98 },
              html2canvas: { scale: 2 },
              jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            
            html2pdf().set(opt).from(resume).save().then(() => {
              console.log('PDF generated successfully');
              window.parent.postMessage({ type: 'DOWNLOAD_SUCCESS' }, '*');
            }).catch((error) => {
              console.error('PDF generation error:', error);
              window.parent.postMessage({ type: 'DOWNLOAD_ERROR', error: error.message }, '*');
            });
          } catch (error) {
            console.error('Error during PDF generation:', error);
            window.parent.postMessage({ type: 'DOWNLOAD_ERROR', error: error.message }, '*');
          }
        }, 100);
        return;
      }
      updateContent(event.data);
    });

    window.parent.postMessage({ type: 'template-ready' }, '*');
  </script>
</body>
