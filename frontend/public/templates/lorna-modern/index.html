<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <title>Lorna Modern</title>
</head>

<body>
<div id="resume" class="resume template-root">
  <header class="top">
    <h1 id="name" contenteditable="true" data-field="name">Lorna Alvarado</h1>
    <h2 id="title" contenteditable="true" data-field="title">Marketing Manager</h2>
  </header>

  <div class="bar">
    <span id="email" contenteditable="true" data-field="email"></span>
    <span id="phone" contenteditable="true" data-field="phone"></span>
    <span id="location" contenteditable="true" data-field="location"></span>
    <span id="website" contenteditable="true" data-field="website"></span>
  </div>

  <div class="columns">
    <aside class="left">
      <section>
        <h3 id="education-heading" contenteditable="true">Education</h3>
        <div id="education-section"></div>
      </section>

      <section>
        <h3 id="skills-heading" contenteditable="true">Skills</h3>
        <ul id="skills-list"></ul>
      </section>

      <section>
        <h3 id="languages-heading" contenteditable="true">Languages</h3>
        <ul id="languages-list"></ul>
      </section>
    </aside>

    <main class="right">
      <section>
        <h3 id="profile-heading" contenteditable="true">Profile</h3>
        <p id="summary" contenteditable="true">Professional summary</p>
      </section>

      <section>
        <h3 id="experience-heading" contenteditable="true">Experience</h3>
        <div id="experience-section"></div>
      </section>

      <section>
        <h3 id="projects-heading" contenteditable="true">Projects</h3>
        <div id="projects-section"></div>
      </section>
    </main>
  </div>
</div>

<script>
function updateContent(data) {
  if (!data || !data.payload) return;

  const payload = data.payload;
  const settings = payload.sectionSettings || {};

  // ===== Font Fix =====
  const font = payload.fontFamily || 'Inter';
  window.currentFont = font; // FIXED
  document.body.style.fontFamily = `'${font}', sans-serif`;

  // ===== About Section Fix =====
  const aboutHeading = document.getElementById('profile-heading');
  const aboutSection = aboutHeading ? aboutHeading.closest('section') : null;

  if (aboutHeading && settings.about?.heading && !aboutHeading.hasAttribute('data-customized')) {
    aboutHeading.textContent = settings.about.heading;
  }

  if (payload.about?.content) {
    document.getElementById('summary').innerHTML = payload.about.content.replace(/\n/g, '<br>');
  }

  if (aboutSection) {
    aboutSection.style.display = settings.about?.visible !== false ? 'block' : 'none';
  }

  // ===== Personal Info =====
  if (payload.personalInfo) {
    const p = payload.personalInfo;
    document.getElementById('name').textContent = p.fullName || '';
    document.getElementById('title').textContent = p.title || '';
    document.getElementById('email').textContent = p.email || '';
    document.getElementById('phone').textContent = p.phone || '';
    document.getElementById('location').textContent = p.location || '';
    document.getElementById('website').textContent = p.website || '';
  }
}

// ===== Inline Edit Listener =====
document.addEventListener('input', e => {
  if (e.target.hasAttribute('contenteditable')) {
    e.target.setAttribute('data-customized', 'true');
  }
});

// ===== Text Formatting Functions =====
function applyFormat(formatType) {
  const selection = window.getSelection();
  if (!selection.rangeCount || selection.isCollapsed) {
    return; // No text selected
  }

  const range = selection.getRangeAt(0);
  const selectedText = range.toString();
  
  if (!selectedText.trim()) {
    return; // No meaningful text selected
  }

  switch (formatType) {
    case 'bold':
      document.execCommand('bold', false, null);
      break;
    case 'italic':
      document.execCommand('italic', false, null);
      break;
    case 'underline':
      document.execCommand('underline', false, null);
      break;
    case 'clear':
      document.execCommand('removeFormat', false, null);
      break;
  }
  
  // Preserve selection after formatting
  selection.removeAllRanges();
  selection.addRange(range);
}

// ===== Notify parent when selection changes =====
document.addEventListener('selectionchange', () => {
  const selection = window.getSelection();
  const hasSelection = selection.rangeCount > 0 && !selection.isCollapsed && selection.toString().trim();
  
  window.parent.postMessage({
    type: 'SELECTION_CHANGED',
    hasSelection: hasSelection
  }, '*');
});

// ===== Prevent Enter key in headings =====
document.addEventListener('keydown', function(e) {
  if (e.target.hasAttribute('contenteditable') && e.key === 'Enter') {
    e.preventDefault();
    e.target.blur();
  }
});

// ===== Message Listener =====
window.addEventListener("message", event => {
  // Handle formatting messages
  if (event.data.type === 'APPLY_FORMAT') {
    applyFormat(event.data.formatType);
    return;
  }
  
  // Handle PDF download
  if (event.data === 'DOWNLOAD_PDF') {
    window.print(); // keep simple for now
    return;
  }
  updateContent(event.data);
});

// Ready
window.parent.postMessage({ type: 'template-ready' }, '*');
</script>

</body>
</html>
