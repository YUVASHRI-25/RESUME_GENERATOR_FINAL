<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Lato:wght@300;400;700&family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Merriweather:wght@300;400;700&family=Montserrat:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <title>Lorna Modern</title>
</head>
<body>
  <div id="resume" class="resume template-root">
    <header class="top">
      <h1 id="name">Lorna Alvarado</h1>
      <h2 id="title">Marketing Manager</h2>
    </header>
    <div class="bar">
      <span id="phone">+123-456-7890</span>
      <span id="email">hello@reallygreatsite.com</span>
      <span id="location">Any City</span>
      <span id="website">www.reallygreatsite.com</span>
    </div>

    <div class="columns">
      <aside class="left">
        <section>
          <h3 id="education-heading">Education</h3>
          <div id="education-section"></div>
        </section>
        <section>
          <h3 id="skills-heading">Skills</h3>
          <ul id="skills-list"></ul>
        </section>
        <section>
          <h3>LANGUAGE</h3>
          <ul id="languages-list"></ul>
        </section>
      </aside>

      <main class="right">
        <section>
          <h3 id="profile-heading">Profile</h3>
          <p id="summary">Professional summary</p>
        </section>
        <section>
          <h3 id="experience-heading">Experience</h3>
          <div id="experience-section"></div>
        </section>
        <section>
          <h3 id="projects-heading">Projects</h3>
          <div id="projects-section"></div>
        </section>
        <section>
          <h3 id="awards-heading">Awards</h3>
          <div id="awards-list"></div>
        </section>
        <section>
          <h3 id="references-heading">References</h3>
          <div id="references-list"></div>
        </section>
        <!-- CUSTOM SECTIONS -->
        <div id="custom-section"></div>
      </main>
    </div>
  </div>

  <script>
    function updateContent(data) {
      if (!data || !data.payload) return;
      
      const payload = data.payload;
      const settings = payload.sectionSettings || {};

      // Apply font
      const font = payload.fontFamily || 'Inter';
      const fontValue = `'${font}', sans-serif`;
      document.documentElement.style.setProperty('--resume-font', fontValue);
      document.body.style.fontFamily = fontValue;

      // Apply theme colors
      if (payload.theme) {
        window.currentTheme = payload.theme; // Store for PDF generation
        const theme = payload.theme;
        if (theme.primaryColor) {
          document.documentElement.style.setProperty('--primary-color', theme.primaryColor);
        }
        if (theme.backgroundColor) {
          document.documentElement.style.setProperty('--background-color', theme.backgroundColor);
        }
        if (theme.textColor) {
          document.documentElement.style.setProperty('--text-color', theme.textColor);
        }
        if (theme.textSecondary) {
          document.documentElement.style.setProperty('--text-secondary', theme.textSecondary);
        }
        if (theme.borderColor) {
          document.documentElement.style.setProperty('--border-color', theme.borderColor);
        }
        if (theme.headerBg) {
          document.documentElement.style.setProperty('--header-bg', theme.headerBg);
        }
        if (theme.barBg) {
          document.documentElement.style.setProperty('--bar-bg', theme.barBg);
        }
      }

      // Personal Info Header
      if (payload.personalInfo) {
        const { fullName, title, email, phone, location, website } = payload.personalInfo;
        if (fullName) document.getElementById('name').textContent = fullName;
        if (title) document.getElementById('title').textContent = title;
        if (email) document.getElementById('email').textContent = email;
        if (phone) document.getElementById('phone').textContent = phone;
        if (location) document.getElementById('location').textContent = location;
        if (website) document.getElementById('website').textContent = website;
      }

      // About Section
      const aboutSection = document.querySelector('[id$="-heading"]').closest('section');
      const aboutHeading = document.getElementById('profile-heading');
      if (aboutHeading && settings.about?.heading) {
        aboutHeading.textContent = settings.about.heading;
      }
      if (payload.about?.content) {
        document.getElementById('summary').textContent = payload.about.content;
      }
      if (aboutSection) {
        aboutSection.style.display = settings.about?.visible !== false ? 'block' : 'none';
      }

      // Education Section
      const eduSection = document.getElementById('education-section');
      const eduHeading = document.getElementById('education-heading');
      if (eduHeading && settings.education?.heading) {
        eduHeading.textContent = settings.education.heading;
      }
      if (eduSection) {
        eduSection.parentElement.style.display = settings.education?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.education)) {
        const content = document.getElementById('education-section');
        content.innerHTML = '';
        payload.education.forEach(edu => {
          const div = document.createElement('div');
          div.style.marginBottom = '10px';
          
          const title = document.createElement('p');
          title.style.fontWeight = 'bold';
          title.style.margin = '0';
          title.textContent = `${edu.degree || ''} ${edu.field ? `in ${edu.field}` : ''}`.trim() || 'Education';
          
          const school = document.createElement('p');
          school.style.margin = '0';
          school.textContent = edu.school || '';
          
          const dates = document.createElement('p');
          dates.style.fontSize = '12px';
          dates.style.margin = '0';
          dates.textContent = `${edu.startDate || ''} ${edu.endDate ? `- ${edu.endDate}` : ''}`.trim();
          
          if (title.textContent) div.appendChild(title);
          if (school.textContent) div.appendChild(school);
          if (dates.textContent) div.appendChild(dates);
          if (edu.description) {
            const desc = document.createElement('p');
            desc.style.margin = '4px 0 0 0';
            desc.textContent = edu.description;
            div.appendChild(desc);
          }
          content.appendChild(div);
        });
      }

      // Skills Section
      const skillsHeading = document.getElementById('skills-heading');
      const skillsSection = skillsHeading?.parentElement;
      if (skillsHeading && settings.skills?.heading) {
        skillsHeading.textContent = settings.skills.heading;
      }
      if (skillsSection) {
        skillsSection.style.display = settings.skills?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.skills)) {
        const list = document.getElementById('skills-list');
        list.innerHTML = '';
        payload.skills.forEach(skill => {
          const li = document.createElement('li');
          li.textContent = skill.name || skill;
          list.appendChild(li);
        });
      }

      // Languages Section
      const langSection = document.getElementById('languages-list').parentElement;
      if (langSection) {
        langSection.style.display = settings.languages?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.languages)) {
        const list = document.getElementById('languages-list');
        list.innerHTML = '';
        payload.languages.forEach(lang => {
          const li = document.createElement('li');
          li.textContent = `${lang.name || 'Language'} – ${lang.level || 'Fluent'}`;
          list.appendChild(li);
        });
      }

      // Experience Section
      const expHeading = document.getElementById('experience-heading');
      const expSection = document.getElementById('experience-section');
      if (expHeading && settings.experience?.heading) {
        expHeading.textContent = settings.experience.heading;
      }
      if (expSection) {
        expSection.parentElement.style.display = settings.experience?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.experiences)) {
        const content = document.getElementById('experience-section');
        content.innerHTML = '';
        payload.experiences.forEach(exp => {
          const div = document.createElement('div');
          div.style.marginBottom = '12px';
          
          const title = document.createElement('p');
          title.style.fontWeight = 'bold';
          title.style.margin = '0 0 4px';
          title.textContent = exp.company || '';
          
          const role = document.createElement('p');
          role.style.margin = '0 0 4px';
          role.style.fontStyle = 'italic';
          role.textContent = exp.position || '';
          
          const dates = document.createElement('p');
          dates.style.margin = '0 0 6px';
          dates.style.fontSize = '12px';
          dates.textContent = `${exp.startDate || ''} ${exp.endDate ? `- ${exp.endDate}` : exp.currentlyWorking ? '- Present' : ''}`.trim();
          
          div.appendChild(title);
          if (role.textContent) div.appendChild(role);
          if (dates.textContent) div.appendChild(dates);
          
          if (exp.description) {
            const desc = document.createElement('p');
            desc.style.margin = '0';
            desc.textContent = exp.description;
            div.appendChild(desc);
          }
          
          if (Array.isArray(exp.bullets)) {
            const ul = document.createElement('ul');
            ul.style.margin = '4px 0 0 0';
            ul.style.paddingLeft = '20px';
            exp.bullets.forEach(bullet => {
              const li = document.createElement('li');
              li.textContent = bullet;
              ul.appendChild(li);
            });
            div.appendChild(ul);
          }
          
          content.appendChild(div);
        });
      }

      // Projects Section
      const projHeading = document.getElementById('projects-heading');
      const projSection = document.getElementById('projects-section');
      if (projHeading && settings.projects?.heading) {
        projHeading.textContent = settings.projects.heading;
      }
      if (projSection) {
        projSection.parentElement.style.display = settings.projects?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.projects)) {
        const content = document.getElementById('projects-section');
        content.innerHTML = '';
        payload.projects.forEach(proj => {
          const div = document.createElement('div');
          div.style.marginBottom = '12px';
          
          const title = document.createElement('p');
          title.style.fontWeight = 'bold';
          title.style.margin = '0 0 4px';
          title.textContent = proj.title || 'Project';
          
          const desc = document.createElement('p');
          desc.style.margin = '0';
          desc.textContent = proj.description || '';
          
          if (title.textContent) div.appendChild(title);
          if (desc.textContent) div.appendChild(desc);
          content.appendChild(div);
        });
      }

      // Awards Section
      const awardsHeading = document.getElementById('awards-heading');
      const awardsSection = document.getElementById('awards-list');
      if (awardsHeading && settings.awards?.heading) {
        awardsHeading.textContent = settings.awards.heading;
      }
      if (awardsSection) {
        awardsSection.parentElement.style.display = settings.awards?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.awards)) {
        const awardsList = document.getElementById('awards-list');
        awardsList.innerHTML = '';
        payload.awards.forEach(award => {
          const div = document.createElement('div');
          div.style.marginBottom = '12px';
          
          const title = document.createElement('p');
          title.style.fontWeight = 'bold';
          title.style.margin = '0 0 4px';
          title.textContent = award.title || award.name || '';
          
          const issuer = document.createElement('p');
          issuer.style.margin = '0 0 2px';
          issuer.style.fontSize = '0.9em';
          issuer.textContent = award.issuer || award.organization || '';
          
          const date = document.createElement('p');
          date.style.margin = '0';
          date.style.fontSize = '0.85em';
          date.style.color = '#666';
          date.textContent = award.date || award.year || '';
          
          if (title.textContent) div.appendChild(title);
          if (issuer.textContent) div.appendChild(issuer);
          if (date.textContent) div.appendChild(date);
          awardsList.appendChild(div);
        });
      }

      // References Section
      const refHeading = document.getElementById('references-heading');
      const refSection = document.getElementById('references-list');
      if (refHeading && settings.references?.heading) {
        refHeading.textContent = settings.references.heading;
      }
      if (refSection) {
        refSection.parentElement.style.display = settings.references?.visible !== false ? 'block' : 'none';
      }
      if (Array.isArray(payload.references)) {
        const refList = document.getElementById('references-list');
        refList.innerHTML = '';
        payload.references.forEach(ref => {
          const div = document.createElement('div');
          div.style.marginBottom = '12px';
          
          const name = document.createElement('p');
          name.style.fontWeight = 'bold';
          name.style.margin = '0 0 4px';
          name.textContent = ref.name || '';
          
          const title = document.createElement('p');
          title.style.margin = '0 0 2px';
          title.style.fontSize = '0.9em';
          title.textContent = ref.title || '';
          
          const company = document.createElement('p');
          company.style.margin = '0 0 2px';
          company.style.fontSize = '0.9em';
          company.textContent = ref.company || '';
          
          const contact = document.createElement('p');
          contact.style.margin = '0';
          contact.style.fontSize = '0.85em';
          contact.style.color = '#666';
          const contactItems = [];
          if (ref.email) contactItems.push(ref.email);
          if (ref.phone) contactItems.push(ref.phone);
          contact.textContent = contactItems.join(' • ');
          
          if (name.textContent) div.appendChild(name);
          if (title.textContent) div.appendChild(title);
          if (company.textContent) div.appendChild(company);
          if (contact.textContent) div.appendChild(contact);
          refList.appendChild(div);
        });
      }

      // Custom Sections
    const customContainer = document.getElementById('custom-section');
    customContainer.innerHTML = '';
    if (Array.isArray(payload.customSections)) {
      payload.customSections.forEach(section => {
        const wrapper = document.createElement('section');
        wrapper.style.marginTop = '16px';
        
        const heading = document.createElement('h3');
        heading.textContent = settings.custom?.heading || section.heading || 'Custom Section';
        heading.style.margin = '0 0 10px 0';
        
        const content = document.createElement('div');
        content.textContent = section.content || '';
        
        wrapper.appendChild(heading);
        wrapper.appendChild(content);
        customContainer.appendChild(wrapper);
      });
    }
    
    // Custom Sections visibility
    if (customContainer) {
      customContainer.style.display = settings.custom?.visible !== false ? 'block' : 'none';
    }
    }

    window.addEventListener("message", (event) => {
      if (event.data === 'DOWNLOAD_PDF') {
        const resume = document.getElementById('resume');
        
        // Apply background color with higher priority for PDF generation
        if (window.currentTheme && window.currentTheme.backgroundColor) {
          const bgColor = window.currentTheme.backgroundColor;
          resume.style.backgroundColor = bgColor;
          resume.style.setProperty('background-color', bgColor, 'important');
          
          // Also apply to body if needed
          document.body.style.backgroundColor = bgColor;
          document.body.style.setProperty('background-color', bgColor, 'important');
        }
        
        // Small delay to ensure styles are applied before PDF generation
        setTimeout(() => {
          const opt = {
            margin: 0,
          filename: 'resume.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(resume).save();
        }, 100);
        return;
      }
      updateContent(event.data);
    });

    window.parent.postMessage({ type: 'template-ready' }, '*');
  </script>
</body>
</html>
