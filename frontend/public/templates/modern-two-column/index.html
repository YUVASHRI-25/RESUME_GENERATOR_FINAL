<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Lato:wght@300;400;700&family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Merriweather:wght@300;400;700&family=Montserrat:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <title>Modern Two Column</title>
</head>
<body>
  <div id="resume" class="resume template-root">
    <header class="header">
      <h1 id="name" class="name" contenteditable="true" data-field="name">YOUR NAME</h1>
      <h2 id="title" class="role" contenteditable="true" data-field="title">YOUR TITLE</h2>
      <div class="contact" contenteditable="true" data-field="contact">
        <span id="email">email@example.com</span>
        <span id="phone">+123-456-7890</span>
        <span id="location">City, Country</span>
        <span id="website">www.example.com</span>
      </div>
    </header>

    <main class="grid">
      <aside class="left">
        <section class="section" id="education-block">
          <h3 id="education-heading" contenteditable="true" data-field="educationHeading">Education</h3>
          <ul id="education-list"></ul>
        </section>
        <section class="section" id="skills-block">
          <h3 id="skills-heading" contenteditable="true" data-field="skillsHeading">Skills</h3>
          <ul id="skills-list"></ul>
        </section>
      </aside>

      <section class="right">
        <section class="section" id="profile-block">
          <h3 id="profile-heading" contenteditable="true" data-field="profileHeading">Profile</h3>
          <p id="summary" contenteditable="true" data-field="summary">Lorem ipsum dolor sit amet.</p>
        </section>
        <section class="section" id="experience-block">
          <h3 id="experience-heading" contenteditable="true" data-field="experienceHeading">Work Experience</h3>
          <div id="experience-section" contenteditable="true" data-field="experiences"></div>
        </section>
        <section class="section" id="projects-block">
          <h3 id="projects-heading" contenteditable="true" data-field="projectsHeading">Projects</h3>
          <div id="projects-section" contenteditable="true" data-field="projects"></div>
        </section>
        <section class="section" id="custom-container">
          <h3 id="custom-heading" contenteditable="true" data-field="customHeading">{{section.custom.heading}}</h3>
          <div id="custom-section" contenteditable="true" data-field="customSections"></div>
        </section>
      </section>
    </main>
  </div>

  <script>
    function updateContent(data) {
      if (!data || !data.payload) return;

      const payload = data.payload;
      const settings = payload.sectionSettings || {};

      // Apply font
      const font = payload.fontFamily || 'Inter';
      const fontValue = `'${font}', sans-serif`;
      document.documentElement.style.setProperty('--resume-font', fontValue);
      document.body.style.fontFamily = fontValue;

      // Personal Info Header
      if (payload.personalInfo) {
        const { fullName, title, email, phone, location, website } = payload.personalInfo;
        if (fullName) document.getElementById('name').textContent = fullName;
        if (title) document.getElementById('title').textContent = title;
        if (email) document.getElementById('email').textContent = email;
        if (phone) document.getElementById('phone').textContent = phone;
        if (location) document.getElementById('location').textContent = location;
        if (website) document.getElementById('website').textContent = website;
      }

      // Profile/About section
      const profileHeading = document.getElementById('profile-heading');
      const profileSection = profileHeading?.closest('.section');
      if (profileHeading && settings.about?.heading) profileHeading.textContent = settings.about.heading;
      if (profileSection) profileSection.style.display = settings.about?.visible !== false ? 'block' : 'none';
      if (payload.about?.content) {
        document.getElementById('summary').textContent = payload.about.content;
      }

      // Education section
      const eduHeading = document.getElementById('education-heading');
      const eduSection = eduHeading?.closest('.section');
      if (eduHeading && settings.education?.heading) eduHeading.textContent = settings.education.heading;
      if (eduSection) eduSection.style.display = settings.education?.visible !== false ? 'block' : 'none';
      if (Array.isArray(payload.education)) {
        const list = document.getElementById('education-list');
        list.innerHTML = '';
        payload.education.forEach(item => {
          const li = document.createElement('li');
          const degree = `${item.degree || ''}${item.field ? ` in ${item.field}` : ''}`.trim();
          const school = item.school || '';
          const dates = `${item.startDate || ''}${item.endDate ? ` - ${item.endDate}` : ''}`.trim();
          
          li.textContent = [degree, school, dates].filter(Boolean).join(' – ');
          if (item.description) {
            const desc = document.createElement('span');
            desc.style.display = 'block';
            desc.style.fontSize = '12px';
            desc.style.marginTop = '4px';
            desc.textContent = item.description;
            li.appendChild(desc);
          }
          list.appendChild(li);
        });
      }

      // Skills section
      const skillsHeading = document.getElementById('skills-heading');
      const skillsSection = skillsHeading?.closest('.section');
      if (skillsHeading && settings.skills?.heading) skillsHeading.textContent = settings.skills.heading;
      if (skillsSection) skillsSection.style.display = settings.skills?.visible !== false ? 'block' : 'none';
      if (Array.isArray(payload.skills)) {
        const list = document.getElementById('skills-list');
        list.innerHTML = '';
        payload.skills.forEach(skill => {
          const li = document.createElement('li');
          li.textContent = skill.name || skill;
          list.appendChild(li);
        });
      }

      // Experience section
      const expHeading = document.getElementById('experience-heading');
      const expSection = expHeading?.closest('.section');
      if (expHeading && settings.experience?.heading) expHeading.textContent = settings.experience.heading;
      if (expSection) expSection.style.display = settings.experience?.visible !== false ? 'block' : 'none';
      if (Array.isArray(payload.experiences)) {
        const wrap = document.getElementById('experience-section');
        wrap.innerHTML = '';
        payload.experiences.forEach(exp => {
          const div = document.createElement('div');
          
          const title = document.createElement('p');
          title.style.fontWeight = '600';
          title.style.margin = '0 0 4px';
          title.textContent = `${exp.position || ''} at ${exp.company || ''}`.trim() || 'Position';

          const dates = document.createElement('p');
          dates.style.margin = '0 0 6px';
          dates.textContent = `${exp.startDate || ''}${exp.endDate ? ` - ${exp.endDate}` : exp.currentlyWorking ? ' - Present' : ''}`.trim();

          const desc = document.createElement('p');
          desc.style.margin = '0 0 10px';
          desc.textContent = exp.description || '';

          if (title.textContent) div.appendChild(title);
          if (dates.textContent) div.appendChild(dates);
          if (desc.textContent) div.appendChild(desc);
          
          if (Array.isArray(exp.bullets)) {
            const ul = document.createElement('ul');
            ul.style.margin = '4px 0 0 0';
            ul.style.paddingLeft = '20px';
            exp.bullets.forEach(bullet => {
              const li = document.createElement('li');
              li.textContent = bullet;
              ul.appendChild(li);
            });
            div.appendChild(ul);
          }
          
          wrap.appendChild(div);
        });
      }

      // Projects section
      const projHeading = document.getElementById('projects-heading');
      const projSection = projHeading?.closest('.section');
      if (projHeading && settings.projects?.heading) projHeading.textContent = settings.projects.heading;
      if (projSection) projSection.style.display = settings.projects?.visible !== false ? 'block' : 'none';
      if (Array.isArray(payload.projects)) {
        const wrap = document.getElementById('projects-section');
        wrap.innerHTML = '';
        payload.projects.forEach(proj => {
          const div = document.createElement('div');
          
          const title = document.createElement('p');
          title.style.fontWeight = '600';
          title.style.margin = '0 0 4px';
          title.textContent = proj.title || 'Project';

          const desc = document.createElement('p');
          desc.style.margin = '0 0 10px';
          desc.textContent = proj.description || '';

          if (title.textContent) div.appendChild(title);
          if (desc.textContent) div.appendChild(desc);
          wrap.appendChild(div);
        });
      }

      // Custom sections
      const customWrap = document.getElementById('custom-section');
      const customContainer = customWrap?.closest('.section');
      const customHeading = document.getElementById('custom-heading');
      if (customHeading && settings.custom?.heading) {
        customHeading.textContent = settings.custom.heading;
      }
      if (customContainer) {
        customContainer.style.display = settings.custom?.visible !== false ? 'block' : 'none';
      }
      if (customWrap) {
        customWrap.innerHTML = '';
        if (Array.isArray(payload.customSections)) {
          payload.customSections.forEach(sec => {
            const block = document.createElement('div');
            
            const title = document.createElement('p');
            title.style.fontWeight = '700';
            title.style.margin = '0 0 4px';
            title.textContent = sec.heading || 'Custom Section';

            const body = document.createElement('p');
            body.style.margin = '0 0 10px';
            body.textContent = sec.content || '';

            if (title.textContent) block.appendChild(title);
            if (body.textContent) block.appendChild(body);
            customWrap.appendChild(block);
          });
        }
      }

      // Column placement for two-column templates
      const leftCol = document.querySelector('.left');
      const rightCol = document.querySelector('.right');
      if (leftCol && rightCol) {
        const moveBlock = (id, col) => {
          const el = document.getElementById(id);
          if (!el || !el.closest('.section')) return;
          const section = el.closest('.section');
          (col === 'left' ? leftCol : rightCol).appendChild(section);
        };
        moveBlock('education-heading', settings.education?.column === 'left' ? 'left' : 'right');
        moveBlock('skills-heading', settings.skills?.column === 'left' ? 'left' : 'right');
        moveBlock('profile-heading', settings.about?.column === 'left' ? 'left' : 'right');
        moveBlock('experience-heading', settings.experience?.column === 'left' ? 'left' : 'right');
        moveBlock('projects-heading', settings.projects?.column === 'left' ? 'left' : 'right');
      }
    }

    window.addEventListener('message', (event) => {
      if (event.data === 'DOWNLOAD_PDF') {
        const resume = document.getElementById('resume');
        const opt = {
          margin: 0,
          filename: 'resume.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(resume).save();
        return;
      }
      updateContent(event.data);
    });

    window.parent.postMessage({ type: 'template-ready' }, '*');
  </script>
</body>
</html>
