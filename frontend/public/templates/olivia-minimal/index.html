<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Olivia Minimal</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Lato:wght@300;400;700&family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Merriweather:wght@300;400;700&family=Montserrat:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  
</head>
<body>

<div class="resume">

  <!-- TOP -->
  <div class="top">
    <div class="line"></div>

    <div class="name-wrap">
      <h1 id="name" contenteditable="true" data-field="name">OLIVIA WILSON</h1>
      <div class="signature" id="signature" contenteditable="true" data-field="signature">Olivia</div>
      <h2 id="title" contenteditable="true" data-field="title">MARKETING MANAGER</h2>
    </div>

    <div class="line"></div>
  </div>

  <!-- GRID -->
  <div class="grid">

    <!-- LEFT -->
    <aside id="left-column">

      <section>
        <span class="pill" contenteditable="true" data-field="contactHeading">CONTACT</span>
        <ul class="icon-list">
          <li><i class="fa-solid fa-phone"></i><span id="phone" contenteditable="true" data-field="phone"></span></li>
          <li><i class="fa-solid fa-envelope"></i><span id="email" contenteditable="true" data-field="email"></span></li>
          <li><i class="fa-solid fa-location-dot"></i><span id="address" contenteditable="true" data-field="address"></span></li>
          <li><i class="fa-solid fa-globe"></i><span id="website" contenteditable="true" data-field="website"></span></li>
        </ul>
      </section>

      <section id="education-section">
        <span class="pill" contenteditable="true" data-field="educationHeading">EDUCATION</span>
        <div id="educationContainer"></div>
      </section>

      <section id="skills-section">
        <span class="pill" contenteditable="true" data-field="skillsHeading">SKILLS</span>
        <ul id="skillsContainer"></ul>
      </section>

      <section id="languages-section">
        <span class="pill" contenteditable="true" data-field="languagesHeading">LANGUAGES</span>
        <ul id="languagesContainer"></ul>
      </section>

      <section id="awards-section">
        <span class="pill" contenteditable="true" data-field="awardsHeading">AWARDS</span>
        <ul id="awardsContainer"></ul>
      </section>

    </aside>

    <!-- RIGHT -->
    <main id="right-column">

      <section id="about-section">
        <span class="pill" contenteditable="true" data-field="aboutHeading">PROFILE SUMMARY</span>
        <p id="summary" contenteditable="true" data-field="summary"></p>
      </section>

      <section id="experience-section">
        <span class="pill" contenteditable="true" data-field="experienceHeading">WORK EXPERIENCE</span>
        <div id="experienceContainer"></div>
      </section>

      <section id="projects-section">
        <span class="pill" contenteditable="true" data-field="projectsHeading">PROJECTS</span>
        <div id="projectsContainer"></div>
      </section>

      <section id="references-section">
        <span class="pill" contenteditable="true" data-field="referencesHeading">REFERENCES</span>
        <div id="referencesContainer"></div>
      </section>

      <!-- CUSTOM SECTIONS -->
      <div id="customSectionsContainer"></div>

    </main>
  </div>

</div>

<script>
  function updateContent(data) {
    if (!data || !data.payload) return;
    
    const payload = data.payload;
    const settings = payload.sectionSettings || {};

    // Apply font
    const font = payload.fontFamily || 'Inter';
    const fontValue = `'${font}', sans-serif`;
    document.documentElement.style.setProperty('--resume-font', fontValue);
    document.body.style.fontFamily = fontValue;

    // Apply theme colors
    if (payload.theme) {
      window.currentTheme = payload.theme; // Store for PDF generation
      const theme = payload.theme;
      if (theme.primaryColor) {
        document.documentElement.style.setProperty('--primary-color', theme.primaryColor);
      }
      if (theme.backgroundColor) {
        document.documentElement.style.setProperty('--background-color', theme.backgroundColor);
      }
      if (theme.textColor) {
        document.documentElement.style.setProperty('--text-color', theme.textColor);
      }
      if (theme.textSecondary) {
        document.documentElement.style.setProperty('--text-secondary', theme.textSecondary);
      }
      if (theme.borderColor) {
        document.documentElement.style.setProperty('--border-color', theme.borderColor);
      }
      if (theme.pillBg) {
        document.documentElement.style.setProperty('--pill-bg', theme.pillBg);
      }
    }

    // Personal info
    if (payload.personalInfo) {
      const { fullName, title, email, phone, location, website, signature } = payload.personalInfo;
      if (fullName) document.getElementById('name').textContent = fullName;
      if (signature) document.getElementById('signature').textContent = signature;
      else if (fullName) document.getElementById('signature').textContent = fullName.split(' ')[0];
      
      if (phone) document.getElementById('phone').textContent = phone;
      if (email) document.getElementById('email').textContent = email;
      if (location) document.getElementById('address').textContent = location;
      if (website) document.getElementById('website').textContent = website;
    }

    // About/Professional Summary Section
    const aboutSection = document.querySelector('section:has(#summary)');
    const aboutPill = aboutSection?.querySelector('.pill');
    // Only apply default heading if user hasn't customized it
    if (aboutPill && settings.about?.heading && !aboutPill.hasAttribute('data-customized')) {
      aboutPill.textContent = settings.about.heading;
    }
    if (aboutSection) aboutSection.style.display = settings.about?.visible !== false ? 'block' : 'none';
    
    if (payload.about?.content) {
      document.getElementById('summary').innerHTML = payload.about.content.replace(/\n/g, '<br>');
    }

    // Education
    const eduSection = document.querySelector('section:has(#educationContainer)');
    const eduPill = eduSection?.querySelector('.pill');
    // Only apply default heading if user hasn't customized it
    if (eduPill && settings.education?.heading && !eduPill.hasAttribute('data-customized')) {
      eduPill.textContent = settings.education.heading;
    }
    if (eduSection) eduSection.style.display = settings.education?.visible !== false ? 'block' : 'none';
    
    if (payload.education && Array.isArray(payload.education)) {
      const container = document.getElementById('educationContainer');
      container.innerHTML = '';
      payload.education.forEach(edu => {
        const block = document.createElement('div');
        block.className = 'job';
        
        const degreeInfo = [];
        if (edu.degree) degreeInfo.push(edu.degree);
        if (edu.field) degreeInfo.push(edu.field);
        
        block.innerHTML = `
          <div class="job-head">
            <strong contenteditable="true" data-field="educationSchool">${edu.school || edu.institution || ''}</strong>
            <span class="year" contenteditable="true" data-field="educationDates">${edu.startDate || ''}${edu.endDate ? ' - ' + edu.endDate : ''}</span>
          </div>
          ${degreeInfo.length > 0 ? `<em contenteditable="true" data-field="educationDegree">${degreeInfo.join(' - ')}</em>` : ''}
          ${edu.description ? `<p contenteditable="true" data-field="educationDescription">${edu.description}</p>` : ''}
          ${edu.bullets && Array.isArray(edu.bullets) ? '<ul>' + edu.bullets.map(b => `<li contenteditable="true" data-field="educationBullet">${b}</li>`).join('') + '</ul>' : ''}
        `;
        container.appendChild(block);
      });
    }

    // Skills
    const skillsSection = document.querySelector('section:has(#skillsContainer)');
    const skillsPill = skillsSection?.querySelector('.pill');
    // Only apply default heading if user hasn't customized it
    if (skillsPill && settings.skills?.heading && !skillsPill.hasAttribute('data-customized')) {
      skillsPill.textContent = settings.skills.heading;
    }
    if (skillsSection) skillsSection.style.display = settings.skills?.visible !== false ? 'block' : 'none';
    
    if (payload.skills && Array.isArray(payload.skills)) {
      const container = document.getElementById('skillsContainer');
      container.innerHTML = '';
      payload.skills.forEach(skill => {
        const li = document.createElement('li');
        li.textContent = typeof skill === 'string' ? skill : (skill.name || '');
        li.contentEditable = 'true';
        li.setAttribute('data-field', 'skillItem');
        container.appendChild(li);
      });
    }

    // Languages
    const languagesSection = document.querySelector('section:has(#languagesContainer)');
    const languagesPill = languagesSection?.querySelector('.pill');
    // Only apply default heading if user hasn't customized it
    if (languagesPill && settings.languages?.heading && !languagesPill.hasAttribute('data-customized')) {
      languagesPill.textContent = settings.languages.heading;
    }
    if (languagesSection) languagesSection.style.display = settings.languages?.visible !== false ? 'block' : 'none';
    
    if (payload.languages && Array.isArray(payload.languages)) {
      const container = document.getElementById('languagesContainer');
      container.innerHTML = '';
      payload.languages.forEach(lang => {
        const li = document.createElement('li');
        li.textContent = typeof lang === 'string' ? lang : (lang.name || '');
        li.contentEditable = 'true';
        li.setAttribute('data-field', 'languageItem');
        container.appendChild(li);
      });
    }

    // Awards
    const awardsSection = document.querySelector('section:has(#awardsContainer)');
    const awardsPill = awardsSection?.querySelector('.pill');
    // Only apply default heading if user hasn't customized it
    if (awardsPill && settings.awards?.heading && !awardsPill.hasAttribute('data-customized')) {
      awardsPill.textContent = settings.awards.heading;
    }
    if (awardsSection) awardsSection.style.display = settings.awards?.visible !== false ? 'block' : 'none';
    
    if (payload.awards && Array.isArray(payload.awards)) {
      const container = document.getElementById('awardsContainer');
      container.innerHTML = '';
      payload.awards.forEach(award => {
        const li = document.createElement('li');
        li.textContent = `${award.title || ''}${award.year ? ` (${award.year})` : ''}`.trim();
        li.contentEditable = 'true';
        li.setAttribute('data-field', 'awardItem');
        container.appendChild(li);
      });
    }

    // Experience
    const expSection = document.querySelector('section:has(#experienceContainer)');
    const expPill = expSection?.querySelector('.pill');
    // Only apply default heading if user hasn't customized it
    if (expPill && settings.experience?.heading && !expPill.hasAttribute('data-customized')) {
      expPill.textContent = settings.experience.heading;
    }
    if (expSection) expSection.style.display = settings.experience?.visible !== false ? 'block' : 'none';
    
    if (payload.experiences && Array.isArray(payload.experiences)) {
      const container = document.getElementById('experienceContainer');
      container.innerHTML = '';
      payload.experiences.forEach(exp => {
        const job = document.createElement('div');
        job.className = 'job';
        const duration = exp.startDate ? exp.startDate + (exp.endDate ? ' - ' + exp.endDate : (exp.currentlyWorking ? ' - Present' : '')) : '';
        const bullets = exp.bullets && Array.isArray(exp.bullets) ? '<ul>' + exp.bullets.map(b => `<li contenteditable="true" data-field="experienceBullet">${b}</li>`).join('') + '</ul>' : '';
        job.innerHTML = `
          <div class="job-head">
            <strong contenteditable="true" data-field="experienceCompany">${exp.company || ''}</strong>
            <span contenteditable="true" data-field="experienceDates">${duration}</span>
          </div>
          <em contenteditable="true" data-field="experiencePosition">${exp.position || exp.role || ''}</em>
          ${bullets}
        `;
        container.appendChild(job);
      });
    }

    // Projects
    const projSection = document.querySelector('section:has(#projectsContainer)');
    const projPill = projSection?.querySelector('.pill');
    // Only apply default heading if user hasn't customized it
    if (projPill && settings.projects?.heading && !projPill.hasAttribute('data-customized')) {
      projPill.textContent = settings.projects.heading;
    }
    if (projSection) projSection.style.display = settings.projects?.visible !== false ? 'block' : 'none';
    
    if (payload.projects && Array.isArray(payload.projects)) {
      const container = document.getElementById('projectsContainer');
      container.innerHTML = '';
      payload.projects.forEach(proj => {
        const div = document.createElement('div');
        div.style.marginBottom = '12px';
        
        const title = document.createElement('p');
        title.style.fontWeight = 'bold';
        title.style.margin = '0 0 4px';
        title.textContent = proj.title || proj.name || '';
        title.contentEditable = 'true';
        title.setAttribute('data-field', 'projectTitle');
        
        const description = document.createElement('p');
        description.style.margin = '0 0 4px';
        description.innerHTML = (proj.description || '').replace(/\n/g, '<br>');
        description.contentEditable = 'true';
        description.setAttribute('data-field', 'projectDescription');
        
        div.appendChild(title);
        if (description.textContent) div.appendChild(description);
        
        if (Array.isArray(proj.bullets)) {
          const ul = document.createElement('ul');
          ul.style.margin = '4px 0 0 0';
          proj.bullets.forEach(bullet => {
            const li = document.createElement('li');
            li.textContent = bullet;
            li.contentEditable = 'true';
            li.setAttribute('data-field', 'projectBullet');
            ul.appendChild(li);
          });
          div.appendChild(ul);
        }
        
        container.appendChild(div);
      });
    }

    // References
    const refSection = document.querySelector('section:has(#referencesContainer)');
    const refPill = refSection?.querySelector('.pill');
    // Only apply default heading if user hasn't customized it
    if (refPill && settings.references?.heading && !refPill.hasAttribute('data-customized')) {
      refPill.textContent = settings.references.heading;
    }
    if (refSection) refSection.style.display = settings.references?.visible !== false ? 'block' : 'none';
    
    if (payload.references && Array.isArray(payload.references)) {
      const container = document.getElementById('referencesContainer');
      container.innerHTML = '';
      payload.references.forEach(ref => {
        const div = document.createElement('div');
        div.style.marginBottom = '12px';
        
        const name = document.createElement('p');
        name.style.fontWeight = 'bold';
        name.style.margin = '0 0 2px';
        name.textContent = ref.name || '';
        name.contentEditable = 'true';
        name.setAttribute('data-field', 'referenceName');
        
        const info = document.createElement('p');
        info.style.margin = '0 0 2px';
        info.style.fontSize = '0.9em';
        info.textContent = `${ref.title || ''}${ref.company ? ` at ${ref.company}` : ''}`.trim();
        info.contentEditable = 'true';
        info.setAttribute('data-field', 'referenceInfo');
        
        const contact = document.createElement('p');
        contact.style.margin = '0';
        contact.style.fontSize = '0.9em';
        contact.style.color = '#666';
        const contactItems = [ref.email, ref.phone].filter(Boolean);
        contact.textContent = contactItems.join(' • ');
        contact.contentEditable = 'true';
        contact.setAttribute('data-field', 'referenceContact');
        
        div.appendChild(name);
        if (info.textContent) div.appendChild(info);
        if (contact.textContent) div.appendChild(contact);
        
        container.appendChild(div);
      });
    }

    // Custom Sections (Drew-Feig Style)
    const customContainer = document.getElementById('customSectionsContainer');
    customContainer.innerHTML = '';
    if (Array.isArray(payload.customSections)) {
      payload.customSections.forEach(section => {
        const wrapper = document.createElement('section');
        wrapper.style.marginTop = '16px';
        
        const heading = document.createElement('span');
        heading.className = 'pill';
        heading.textContent = settings.custom?.heading || section.heading || 'Custom Section';
        heading.style.margin = '0 0 10px 0';
        heading.contentEditable = 'true';
        heading.setAttribute('data-field', 'customSectionHeading');
        
        const content = document.createElement('div');
        
        // Handle content with bullets
        if (section.bullets && section.bullets.length > 0) {
          // If bullets exist, render description first (if any), then bullets
          if (section.content) {
            const p = document.createElement('p');
            p.textContent = section.content;
            p.style.marginBottom = '8px';
            p.contentEditable = 'true';
            p.setAttribute('data-field', 'customSectionContent');
            content.appendChild(p);
          }
          
          const ul = document.createElement('ul');
          section.bullets.forEach(bullet => {
            if (bullet) {
              const li = document.createElement('li');
              li.textContent = bullet;
              li.contentEditable = 'true';
              li.setAttribute('data-field', 'customSectionBullet');
              ul.appendChild(li);
            }
          });
          content.appendChild(ul);
        } else if (section.items && Array.isArray(section.items)) {
          // Legacy support for items
          const ul = document.createElement('ul');
          section.items.forEach(item => {
            const li = document.createElement('li');
            li.textContent = item;
            li.contentEditable = 'true';
            li.setAttribute('data-field', 'customSectionItem');
            ul.appendChild(li);
          });
          content.appendChild(ul);
        } else if (section.content) {
          const p = document.createElement('p');
          p.textContent = section.content;
          p.contentEditable = 'true';
          p.setAttribute('data-field', 'customSectionContent');
          content.appendChild(p);
        }
        
        wrapper.appendChild(heading);
        wrapper.appendChild(content);
        customContainer.appendChild(wrapper);
      });
    }
    
    // Custom Sections visibility
    if (customContainer) {
      customContainer.style.display = settings.custom?.visible !== false ? 'block' : 'none';
    }

    // Column placement (move sections between left/right)
    const leftColumn = document.getElementById('left-column');
    const rightColumn = document.getElementById('right-column');
    if (leftColumn && rightColumn) {
      const moveSection = (sectionId, toLeft) => {
        const section = document.getElementById(sectionId);
        if (section && section.parentElement) {
          (toLeft ? leftColumn : rightColumn).appendChild(section);
        }
      };
      
      // Move sections based on column settings
      moveSection('education-section', settings.education?.column === 'left');
      moveSection('skills-section', settings.skills?.column === 'left');
      moveSection('languages-section', settings.languages?.column === 'left');
      moveSection('awards-section', settings.awards?.column === 'left');
      moveSection('about-section', settings.about?.column === 'left');
      moveSection('experience-section', settings.experience?.column === 'left');
      moveSection('projects-section', settings.projects?.column === 'left');
      moveSection('references-section', settings.references?.column === 'left');
      
      // Position custom sections in the appropriate column
      if (customContainer) {
        const targetColumn = settings.custom?.column === 'left' ? leftColumn : rightColumn;
        if (targetColumn) {
          targetColumn.appendChild(customContainer);
        }
      }
    }
  }

  // WYSIWYG Text Formatting Functions
  function applyFormat(formatType, value = null) {
    const selection = window.getSelection();
    if (!selection.rangeCount || selection.isCollapsed) {
      return; // No text selected
    }

    const range = selection.getRangeAt(0);
    const selectedText = range.toString();
    
    if (!selectedText.trim()) {
      return; // No meaningful text selected
    }

    switch (formatType) {
      case 'bold':
        document.execCommand('bold', false, null);
        break;
      case 'italic':
        document.execCommand('italic', false, null);
        break;
      case 'underline':
        document.execCommand('underline', false, null);
        break;
      case 'fontSize':
        document.execCommand('fontSize', false, value);
        break;
      case 'clear':
        document.execCommand('removeFormat', false, null);
        break;
    }
    
    // Preserve selection after formatting
    selection.removeAllRanges();
    selection.addRange(range);
  }

  // Handle formatting messages from parent
  window.addEventListener('message', (event) => {
    if (event.data.type === 'APPLY_FORMAT') {
      applyFormat(event.data.formatType, event.data.value);
    }
  });

  // Notify parent when selection changes
  document.addEventListener('selectionchange', () => {
    const selection = window.getSelection();
    const hasSelection = selection.rangeCount > 0 && !selection.isCollapsed && selection.toString().trim();
    
    window.parent.postMessage({
      type: 'SELECTION_CHANGED',
      hasSelection: hasSelection
    }, '*');
  });

  // Handle inline editing for headings
  document.addEventListener('input', function(e) {
    if (e.target.hasAttribute('contenteditable') && e.target.hasAttribute('data-field')) {
      const field = e.target.getAttribute('data-field');
      const value = e.target.textContent.trim();
      
      // Mark this heading as customized
      e.target.setAttribute('data-customized', 'true');
      
      // Send updated heading to parent
      window.parent.postMessage({
        type: 'heading-update',
        field: field,
        value: value
      }, '*');
    }
  });

  // Prevent Enter key from creating new lines in headings
  document.addEventListener('keydown', function(e) {
    if (e.target.hasAttribute('contenteditable') && e.key === 'Enter') {
      e.preventDefault();
      e.target.blur();
    }
  });

  window.addEventListener('message', (event) => {
    if (event.data.type === 'UPDATE_CONTENT') {
      updateContent(event.data);
    } else if (event.data === 'DOWNLOAD_PDF') {
      const resume = document.querySelector('.resume');
      
      // Apply background color with higher priority for PDF generation
      if (window.currentTheme && window.currentTheme.backgroundColor) {
        const bgColor = window.currentTheme.backgroundColor;
        resume.style.backgroundColor = bgColor;
        resume.style.setProperty('background-color', bgColor, 'important');
        
        // Also apply to body if needed
        document.body.style.backgroundColor = bgColor;
        document.body.style.setProperty('background-color', bgColor, 'important');
      }
      
      // Small delay to ensure styles are applied before PDF generation
      setTimeout(() => {
        const opt = {
          margin: 0.5,
          filename: 'resume.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { 
            scale: 2,
            useCORS: true,
            allowTaint: true,
            logging: false,
            letterRendering: true,
            foreignObjectRendering: false
          },
          jsPDF: { 
            unit: 'in', 
            format: 'letter', 
            orientation: 'portrait',
            compress: true
          },
          pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };
        
        html2pdf().set(opt).from(resume).save().then(() => {
          console.log('PDF generated successfully');
          window.parent.postMessage({ type: 'DOWNLOAD_SUCCESS' }, '*');
        }).catch((error) => {
          console.error('PDF generation error:', error);
          window.parent.postMessage({ type: 'DOWNLOAD_ERROR', error: error.message }, '*');
        });
      }, 200);
    }
  });
</script>

</body>
</html>
