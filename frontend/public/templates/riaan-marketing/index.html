<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Riaan Marketing Template</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div id="resume" class="resume template-root">

  <!-- HEADER -->
  <div class="header">
    <div class="left">
      <h1 id="fullName">{{name}}</h1>
      <h2 id="title">{{title}}</h2>
    </div>
    <div class="right">
      <p id="phone">{{phone}}</p>
      <p id="location">{{location}}</p>
      <p id="website">{{website}}</p>
      <p id="email">{{email}}</p>
    </div>
  </div>

  <!-- ABOUT -->
  <section id="about-section">
    <h3 id="about-heading">{{section.about.heading}}</h3>
    <p id="summary">{{section.about.content}}</p>
  </section>

  <!-- EDUCATION -->
  <section id="education-section">
    <h3 id="education-heading">{{section.education.heading}}</h3>
    <div id="education-list"></div>
  </section>

  <!-- SKILLS -->
  <section id="skills-section">
    <h3 id="skills-heading">{{section.skills.heading}}</h3>
    <ul class="skills" id="skills-list"></ul>
  </section>

  <!-- WORK EXPERIENCE -->
  <section id="experience-section">
    <h3 id="experience-heading">{{section.experience.heading}}</h3>
    <div id="experience-list"></div>
  </section>

  <!-- PROJECTS -->
  <section id="projects-section">
    <h3 id="projects-heading">{{section.projects.heading}}</h3>
    <div id="projects-list"></div>
  </section>

  <!-- CUSTOM SECTIONS -->
  <section id="custom-section">
    <h3 id="custom-heading">{{section.custom.heading}}</h3>
    <div id="custom-sections"></div>
  </section>

</div>

<script>
  function updateContent(data) {
    if (!data || !data.payload) return;

    const payload = data.payload;
    const settings = payload.sectionSettings || {};

    // Apply font
    const font = payload.fontFamily || 'Inter';
    const fontValue = `'${font}', sans-serif`;
    document.documentElement.style.setProperty('--resume-font', fontValue);
    document.body.style.fontFamily = fontValue;
    const resume = document.getElementById('resume');
    if (resume) resume.style.fontFamily = fontValue;

    // Personal Info
    if (payload.personalInfo) {
      const { fullName, title, email, phone, location, website } = payload.personalInfo;
      if (fullName) document.getElementById('fullName').textContent = fullName;
      if (title) document.getElementById('title').textContent = title;
      if (phone) document.getElementById('phone').textContent = phone;
      if (location) document.getElementById('location').textContent = location;
      if (website) document.getElementById('website').textContent = website;
      if (email) document.getElementById('email').textContent = email;
    }

    // About Section
    const aboutHeading = document.getElementById('about-heading');
    const aboutSection = aboutHeading?.closest('section');
    if (aboutHeading && settings.about?.heading) {
      aboutHeading.textContent = settings.about.heading;
    }
    if (aboutSection) {
      aboutSection.style.display = settings.about?.visible !== false ? 'block' : 'none';
    }
    if (payload.about?.content) {
      document.getElementById('summary').textContent = payload.about.content;
    }

    // Education Section
    const eduHeading = document.getElementById('education-heading');
    const eduSection = eduHeading?.closest('section');
    if (eduHeading && settings.education?.heading) {
      eduHeading.textContent = settings.education.heading;
    }
    if (eduSection) {
      eduSection.style.display = settings.education?.visible !== false ? 'block' : 'none';
    }
    if (Array.isArray(payload.education)) {
      const eduList = document.getElementById('education-list');
      eduList.innerHTML = '';
      payload.education.forEach(edu => {
        const div = document.createElement('p');
        const parts = [];
        if (edu.degree) parts.push(`<strong>${edu.degree}</strong>`);
        if (edu.school) parts.push(edu.school);
        if (edu.field) parts.push(edu.field);
        if (edu.startDate || edu.endDate) {
          const dateStr = `${edu.startDate || ''} ${edu.endDate ? `- ${edu.endDate}` : ''}`.trim();
          parts.push(`<span>(${dateStr})</span>`);
        }
        div.innerHTML = parts.join(' — ');
        
        if (edu.description) {
          const desc = document.createElement('small');
          desc.textContent = edu.description;
          div.appendChild(desc);
        }
        eduList.appendChild(div);
      });
    }

    // Skills Section
    const skillsHeading = document.getElementById('skills-heading');
    const skillsSection = skillsHeading?.closest('section');
    if (skillsHeading && settings.skills?.heading) {
      skillsHeading.textContent = settings.skills.heading;
    }
    if (skillsSection) {
      skillsSection.style.display = settings.skills?.visible !== false ? 'block' : 'none';
    }
    if (Array.isArray(payload.skills)) {
      const skillsList = document.getElementById('skills-list');
      skillsList.innerHTML = '';
      payload.skills.forEach(skill => {
        const li = document.createElement('li');
        li.textContent = skill.name || skill;
        skillsList.appendChild(li);
      });
    }

    // Experience Section
    const expHeading = document.getElementById('experience-heading');
    const expSection = expHeading?.closest('section');
    if (expHeading && settings.experience?.heading) {
      expHeading.textContent = settings.experience.heading;
    }
    if (expSection) {
      expSection.style.display = settings.experience?.visible !== false ? 'block' : 'none';
    }
    if (Array.isArray(payload.experiences)) {
      const expList = document.getElementById('experience-list');
      expList.innerHTML = '';
      payload.experiences.forEach(exp => {
        const div = document.createElement('div');
        div.className = 'job';

        const titleDiv = document.createElement('div');
        titleDiv.className = 'job-header';
        
        const titleSpan = document.createElement('span');
        titleSpan.className = 'job-title';
        const parts = [];
        if (exp.position) parts.push(exp.position);
        if (exp.company) parts.push(exp.company);
        titleSpan.textContent = parts.join(' - ');
        
        const dateSpan = document.createElement('span');
        dateSpan.className = 'job-date';
        if (exp.startDate || exp.endDate || exp.currentlyWorking) {
          dateSpan.textContent = `${exp.startDate || ''} ${exp.endDate ? `- ${exp.endDate}` : exp.currentlyWorking ? '- Present' : ''}`.trim();
        }
        
        titleDiv.appendChild(titleSpan);
        if (dateSpan.textContent) titleDiv.appendChild(dateSpan);
        div.appendChild(titleDiv);

        if (exp.description) {
          const desc = document.createElement('p');
          desc.textContent = exp.description;
          div.appendChild(desc);
        }

        if (Array.isArray(exp.bullets) && exp.bullets.length > 0) {
          const ul = document.createElement('ul');
          exp.bullets.forEach(bullet => {
            const li = document.createElement('li');
            li.textContent = bullet;
            ul.appendChild(li);
          });
          div.appendChild(ul);
        }

        expList.appendChild(div);
      });
    }

    // Projects Section
    const projHeading = document.getElementById('projects-heading');
    const projSection = projHeading?.closest('section');
    if (projHeading && settings.projects?.heading) {
      projHeading.textContent = settings.projects.heading;
    }
    if (projSection) {
      projSection.style.display = settings.projects?.visible !== false ? 'block' : 'none';
    }
    if (Array.isArray(payload.projects)) {
      const projectsList = document.getElementById('projects-list');
      projectsList.innerHTML = '';
      payload.projects.forEach(proj => {
        const div = document.createElement('div');
        div.className = 'project';

        const titleDiv = document.createElement('p');
        titleDiv.className = 'project-title';
        titleDiv.textContent = proj.title || proj.name || '';

        const desc = document.createElement('p');
        desc.textContent = proj.description || '';

        if (titleDiv.textContent) div.appendChild(titleDiv);
        if (desc.textContent) div.appendChild(desc);
        projectsList.appendChild(div);
      });
    }

    // Custom Sections
    const customHeading = document.getElementById('custom-heading');
    const customSection = customHeading?.closest('section');
    if (customHeading && settings.custom?.heading) {
      customHeading.textContent = settings.custom.heading;
    }
    if (customSection) {
      customSection.style.display = settings.custom?.visible !== false ? 'block' : 'none';
    }
    const customDiv = document.getElementById('custom-sections');
    if (customDiv) {
      customDiv.innerHTML = '';
      if (Array.isArray(payload.customSections)) {
        payload.customSections.forEach(section => {
          if (!section || (!section.heading && !section.content)) return;
          const div = document.createElement('div');
          div.className = 'custom-block';
          
          const heading = document.createElement('p');
          heading.style.fontWeight = 'bold';
          heading.style.margin = '0 0 4px';
          heading.textContent = section.heading || '';
          
          const content = document.createElement('p');
          content.style.margin = '0 0 10px';
          content.textContent = section.content || '';
          
          if (heading.textContent) div.appendChild(heading);
          if (content.textContent) div.appendChild(content);
          customDiv.appendChild(div);
        });
      }
    }
  }

  window.addEventListener("message", (event) => {
    if (event.data === 'DOWNLOAD_PDF') {
      const resume = document.getElementById('resume');
      const opt = {
        margin: 0,
        filename: 'resume.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(resume).save();
      return;
    }
    updateContent(event.data);
  });

  window.parent.postMessage({ type: 'template-ready' }, '*');
</script>

</body>
</html>
